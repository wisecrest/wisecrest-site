<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wisecrest: India's money questions, answered simply</title>
<meta name="description" content="Free Indian finance calculators, bank FD rate comparison and plain-language guides in English and Hindi. No sign-up, no phone number.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{
  --ink:#0f1b2d;--muted:#5b6b82;--line:#e3e8f0;--bg:#f6f8fb;--card:#fff;
  --teal:#0e7c6b;--teal2:#12a58e;--tealbg:#ecf8f5;--saffron:#f29a1f;--saffron2:#ffb547;--navy:#14284b;
  --up:#0e9f6e;--down:#d64545;--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Plus Jakarta Sans","Noto Sans Devanagari",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;padding-bottom:70px}
body.hi{font-family:"Noto Sans Devanagari","Plus Jakarta Sans",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.sample{background:#fff7e6;color:#8a5300;font-size:12.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #f5d9a8}

/* ticker */
.ticker{background:var(--navy);color:#dfe8f7;overflow:hidden;white-space:nowrap;font-size:13.5px}
.ticker:hover .track{animation-play-state:paused}
.track{display:inline-flex;animation:scroll 60s linear infinite;padding:9px 0}
.tk{display:inline-flex;align-items:center;gap:7px;padding:0 22px;border-right:1px solid rgba(255,255,255,.12);cursor:pointer}
.tk:hover{color:#fff}.tk b{color:#fff}.tk .u{color:#41d6a3}.tk .d{color:#ff7b7b}.tk .lbl{opacity:.75}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}}

/* header */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.hd{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--teal2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px}
.logo span{color:var(--saffron)}
nav.menu{display:flex;gap:2px}
nav.menu a{padding:8px 12px;border-radius:10px;font-weight:600;font-size:14.5px;color:#334561}
nav.menu a:hover,nav.menu a.on{background:var(--tealbg);color:var(--teal)}
.hd-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;height:38px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--muted)}
.icon-btn:hover{border-color:var(--teal);color:var(--teal)}
.icon-btn kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.lang{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.lang button.on{background:#fff;color:var(--teal);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.alert-btn{border:0;background:var(--saffron);color:#fff;font-weight:700;padding:9px 14px;border-radius:10px;font-size:14px}
@media(max-width:940px){nav.menu,.alert-btn,.icon-btn kbd{display:none}}

/* generic */
main{min-height:60vh}
.page{padding:34px 0 50px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:12px}
.crumbs a{color:var(--teal);font-weight:600}
h1.pt{font-size:clamp(26px,3.6vw,38px);letter-spacing:-.8px;line-height:1.2;font-weight:800}
.lead{color:var(--muted);font-size:16px;margin-top:6px;max-width:720px}
h2.st{font-size:22px;letter-spacing:-.4px;font-weight:800;margin-top:38px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card h3{font-size:18px;font-weight:800}
.meta{font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:#fff2dd;color:#a5620a}
.badge.ok{background:#e4f6ef;color:#0b7a55}
.btn{border:0;background:var(--teal);color:#fff;font-weight:700;padding:11px 18px;border-radius:11px;font-size:15px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:#0b6a5b}
.btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.prose{max-width:760px}
.prose p{margin-top:12px}
.prose h3{font-size:18px;margin-top:24px}
.prose ul,.prose ol{margin:10px 0 0 22px}
.prose li{margin-top:6px}
.callout{background:var(--tealbg);border-left:4px solid var(--teal);border-radius:10px;padding:12px 14px;margin-top:16px;font-size:14.5px}
.callout.warn{background:#fff6e8;border-color:var(--saffron)}
.src{font-size:12.5px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:12px}

/* hero */
.hero{background:radial-gradient(1200px 400px at 80% -10%,#d9f4ee 0,transparent 60%),radial-gradient(700px 300px at 0% 0%,#fff1dc 0,transparent 60%),#fff;padding:50px 0 40px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(28px,4.6vw,48px);line-height:1.12;letter-spacing:-1px;font-weight:800;max-width:780px}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero p.sub{color:var(--muted);font-size:17px;margin-top:12px;max-width:640px}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:13.5px;color:#334561;font-weight:600}
.search{position:relative;margin-top:24px;max-width:700px}
.search input{width:100%;padding:18px 20px 18px 52px;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:16px;background:#fff;outline:none;transition:.2s;box-shadow:0 8px 30px rgba(20,40,75,.06)}
.search input:focus{border-color:var(--teal)}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(20,40,75,.14);overflow:hidden;display:none;z-index:35;max-height:420px;overflow-y:auto}
.results a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.results a:last-child{border-bottom:0}
.results a:hover,.results a.sel{background:#f0faf7;color:var(--teal)}
.results small{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.tries{margin-top:12px;font-size:13.5px;color:var(--muted)}
.tries button{border:1px dashed #c8d2e0;background:#fff;border-radius:999px;padding:4px 11px;margin:4px 4px 0 0;font-size:13px;color:#334561}
.tries button:hover{border-color:var(--teal);color:var(--teal)}

/* search overlay */
.ovl{position:fixed;inset:0;background:rgba(15,27,45,.45);z-index:60;display:none;padding:70px 16px}
.ovl.on{display:block}
.ovl .box{max-width:680px;margin:0 auto;position:relative}
.ovl .results{position:static;display:block;margin-top:8px}

/* chips & tool cards */
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.chip:hover{border-color:var(--teal)}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.tool{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;transition:.18s;display:flex;flex-direction:column;gap:3px}
.tool:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,40,75,.08);border-color:#c9e9e1}
.tool .ic{font-size:22px}
.tool b{font-size:15px}
.tool span{font-size:13px;color:var(--muted)}
.catblock{margin-top:30px}
.catblock h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.catblock h2 small{font-size:13px;color:var(--muted);font-weight:600}

/* tool page */
.tp{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;margin-top:20px}
@media(max-width:880px){.tp{grid-template-columns:1fr}.res{position:static}}
.field{margin-top:14px}
.field:first-child{margin-top:0}
.field label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.field input,.field select,.field textarea{width:100%;margin-top:6px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal)}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.res{background:linear-gradient(135deg,#0e7c6b,#0f5f73);color:#fff;border-radius:var(--r);padding:22px;position:sticky;top:84px}
.res .bl{font-size:13px;opacity:.85}
.res .big{font-size:clamp(26px,3.4vw,34px);font-weight:800;letter-spacing:-.5px;line-height:1.2}
.res .bw{font-size:13px;opacity:.85;margin-top:2px}
.res .rows{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.res .rows div{background:rgba(255,255,255,.1);border-radius:10px;padding:9px 11px;font-size:13px}
.res .rows b{display:block;font-size:16.5px}
.res .verdict{margin-top:12px;font-size:14px;background:rgba(255,255,255,.14);border-radius:10px;padding:10px 12px}
.res table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.res th,.res td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.15);text-align:right}
.res th:first-child,.res td:first-child{text-align:left}
.res th{font-weight:700;opacity:.8}
.res pre{white-space:pre-wrap;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);border-radius:10px;padding:14px;margin-top:10px;max-height:420px;overflow:auto}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.15)}
.bar i{display:block;height:100%;transition:width .5s}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:7px;opacity:.95}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.res .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.res .acts button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600}
.res .acts button:hover{background:rgba(255,255,255,.2)}
.howbox{margin-top:22px}
.rel{margin-top:30px}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:12px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:11px 6px;border-bottom:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:right}
table.t td.rate{font-weight:800;font-size:16px;text-align:right}
table.t tr.top td{background:#f2fbf8}
.type{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eef2f8;color:#4b5d78;margin-left:6px;white-space:nowrap}
.type.sfb{background:#fff2dd;color:#a5620a}.type.psb{background:#e5f4ff;color:#1d5f95}
.chg{font-size:12px;font-weight:700;margin-left:6px}.chg.u{color:var(--up)}.chg.d{color:var(--down)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.two{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.tw{overflow-x:auto}

/* news, guides */
.nw{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:block}
.nw .tag{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--saffron)}
.nw b{display:block;margin-top:5px;font-size:15.5px;line-height:1.35}
.nw p{font-size:13.5px;color:var(--muted);margin-top:6px}
.nw .dt{font-size:12px;color:var(--muted);margin-top:8px}
.gl dt{font-weight:800;margin-top:16px}
.gl dd{color:#334561;margin-top:2px}
.az{columns:3 220px;margin-top:16px}
.az a{display:block;padding:4px 0;color:#1d4f80;font-weight:500;break-inside:avoid}
.az h3{margin-top:14px;color:var(--teal);font-size:15px}

/* newsletter */
.nl{background:linear-gradient(135deg,#14284b,#1d3d70);color:#fff;border-radius:20px;padding:28px;margin-top:40px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
@media(max-width:800px){.nl{grid-template-columns:1fr}}
.nl h3{font-size:22px}
.nl p{opacity:.8;font-size:14.5px;margin-top:4px}
.nl form{display:flex;gap:8px;flex-wrap:wrap}
.nl input{flex:1;min-width:200px;padding:13px 14px;border-radius:11px;border:0;font:inherit;font-size:15px}
.nl small{display:block;opacity:.7;font-size:12px;margin-top:8px;width:100%}

footer{background:var(--navy);color:#b9c6dc;padding:36px 0 26px;font-size:13.5px;margin-top:30px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:20px}
@media(max-width:800px){footer .cols{grid-template-columns:1fr 1fr}}
footer b{color:#fff;display:block;margin-bottom:8px}
footer a{display:block;padding:3px 0}
footer a:hover{color:#fff}
footer .fine{border-top:1px solid rgba(255,255,255,.12);margin-top:22px;padding-top:14px;font-size:12.5px}

.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:none;z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;color:var(--muted);gap:2px}
.tabbar a.on{color:var(--teal)}
.tabbar a i{font-style:normal;font-size:19px}
@media(max-width:940px){.tabbar{display:flex}}
@media(min-width:941px){body{padding-bottom:0}}

.cookie{position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(20,40,75,.2);padding:18px;z-index:70;font-size:14px}
@media(max-width:940px){.cookie{bottom:80px}}
.cookie .row{display:flex;gap:8px;margin-top:12px}
.cookie .row button{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:opacity .3s;opacity:0;pointer-events:none}

.reveal{opacity:0;transform:translateY(14px);transition:.6s}
.reveal.in{opacity:1;transform:none}

@media print{
  header,.ticker,.tabbar,footer,.sample,.rel,.res .acts,.cookie,.nl{display:none!important}
  body{background:#fff}.res{position:static;color:#000;background:#fff;border:2px solid #000}
  .res .rows div{background:#f3f3f3}
}
</style>

<div class="sample" id="sampleBar"></div>
<div class="ticker"><div class="track" id="track"></div></div>
<header>
  <div class="wrap hd">
    <a class="logo" href="#home"><i>W</i><b style="font-weight:800">Wise<span>crest</span></b></a>
    <nav class="menu" id="menu"></nav>

</header>
<main id="app"></main>

<script>/* ================= core helpers ================= */
let LANG = "en";
const T = x => x == null ? "" : (typeof x === "string" || typeof x === "number") ? String(x) : (LANG === "hi" ? (x[1] ?? x[0]) : x[0]);
const inr = (n, d = 0) => (n < 0 ? "−₹" : "₹") + Math.abs(n).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n, d = 2) => (+n).toFixed(d) + "%";
const num = (n, d = 0) => (+n).toLocaleString("en-IN", { maximumFractionDigits: d });
function words(n) {
  n = Math.round(Math.abs(n)); const hi = LANG === "hi"; const s = n < 0 ? "−" : "";
  const f = x => +x.toFixed(2);
  if (n >= 1e7) return s + "₹" + f(n / 1e7) + (hi ? " करोड़" : " crore");
  if (n >= 1e5) return s + "₹" + f(n / 1e5) + (hi ? " लाख" : " lakh");
  if (n >= 1e3) return s + "₹" + f(n / 1e3) + (hi ? " हज़ार" : " thousand");
  return s + "₹" + n;
}
const yrs = n => LANG === "hi" ? n + " साल" : n + (n == 1 ? " year" : " years");
const mos = n => LANG === "hi" ? n + " महीने" : n + (n == 1 ? " month" : " months");
function ymo(m) { m = Math.round(m); const y = Math.floor(m / 12), r = m % 12; const hi = LANG === "hi";
  return (y ? (hi ? y + " साल " : y + (y == 1 ? " year " : " years ")) : "") + (r ? (hi ? r + " महीने" : r + (r == 1 ? " month" : " months")) : "").trim(); }
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ================= finance maths ================= */
const emi = (P, annual, months) => { const r = annual / 1200; if (!r) return P / months; return P * r * Math.pow(1 + r, months) / (Math.pow(1 + r, months) - 1); };
const fv = (P, annual, yrs, m = 1) => P * Math.pow(1 + annual / 100 / m, m * yrs);
const sipFV = (M, annual, months) => { const r = annual / 1200; if (!r) return M * months; return M * ((Math.pow(1 + r, months) - 1) / r) * (1 + r); };
const sipNeed = (target, annual, months) => { const r = annual / 1200; if (!r) return target / months; return target / (((Math.pow(1 + r, months) - 1) / r) * (1 + r)); };
function tenureFor(P, annual, E) { const r = annual / 1200; if (E <= P * r) return Infinity; return -Math.log(1 - r * P / E) / Math.log(1 + r); }
function outstanding(P, annual, months, paid) { const r = annual / 1200, E = emi(P, annual, months); return P * Math.pow(1 + r, paid) - E * ((Math.pow(1 + r, paid) - 1) / r); }

/* ================= Indian income tax (Tax Year 2026-27) =================
   New regime slabs unchanged: 0-4L nil … 24L+ 30%; rebate makes tax nil up to ₹12L taxable (with marginal relief).
   Old regime: 2.5L / 3L (60-79) / 5L (80+) exemption, 5-20-30, rebate up to ₹5L taxable.
   Surcharge 10/15/25/37% (new regime capped at 25%). Health & education cess 4%.          */
const NEW_SLABS = [[400000, 0], [800000, .05], [1200000, .10], [1600000, .15], [2000000, .20], [2400000, .25], [Infinity, .30]];
function slabTax(ti, slabs) { let tax = 0, prev = 0; for (const [lim, r] of slabs) { if (ti > prev) tax += (Math.min(ti, lim) - prev) * r; prev = lim; } return tax; }
function surcharge(ti, tax, regime) {
  let r = 0; if (ti > 5e7) r = regime === "new" ? .25 : .37; else if (ti > 2e7) r = .25; else if (ti > 1e7) r = .15; else if (ti > 5e6) r = .10;
  return tax * r;
}
function newRegimeTax(ti) {
  ti = Math.max(0, ti); let base = slabTax(ti, NEW_SLABS), rebate = 0;
  if (ti <= 1200000) { rebate = base; } else { const relief = Math.max(0, base - (ti - 1200000)); rebate = relief; }
  const afterRebate = base - rebate; const sc = surcharge(ti, afterRebate, "new"); const cess = (afterRebate + sc) * .04;
  return { base, rebate, sc, cess, total: afterRebate + sc + cess };
}
function oldRegimeTax(ti, age = "u60") {
  ti = Math.max(0, ti); const ex = age === "80" ? 500000 : age === "60" ? 300000 : 250000;
  const slabs = [[ex, 0], [500000, .05], [1000000, .20], [Infinity, .30]].filter((s, i) => i === 0 || s[0] > ex);
  let base = slabTax(ti, slabs), rebate = ti <= 500000 ? base : 0;
  const after = base - rebate; const sc = surcharge(ti, after, "old"); const cess = (after + sc) * .04;
  return { base, rebate, sc, cess, total: after + sc + cess };
}
function slabRate(ti) { // marginal new-regime slab rate for display
  for (const [lim, r] of NEW_SLABS) if (ti <= lim) return r; return .3;
}

{ id: "tds", cat: "tax", ic: "🏦", n: L("TDS on FD interest", "FD ब्याज पर TDS"), d: L("Will the bank cut tax? How much?", "क्या बैंक टैक्स काटेगा? कितना?"),

{ id: "capgain", cat: "tax", ic: "📈", n: L("Capital gains tax", "कैपिटल गेन टैक्स"), d: L("Shares, mutual funds, property, gold", "शेयर, म्यूचुअल फ़ंड, प्रॉपर्टी, सोना"),

      rows: [[L("Belated return by", "देर से रिटर्न"), T(["31 December", "31 दिसंबर"])], [L("Revised return by", "संशोधित रिटर्न"), T(["31 March", "31 मार्च"])], [L("Audit cases", "ऑडिट मामले"), T(["31 October", "31 अक्टूबर"])], [L("Late fee", "लेट फ़ीस"), T(["₹1,000 (income ≤ ₹5L) or ₹5,000", "₹1,000 (आय ≤ ₹5 लाख) या ₹5,000"])]],
      verdict: T(["Before filing: download AIS and Form 26AS from the e-filing portal and check every interest, dividend and TDS entry matches.", "फ़ाइल करने से पहले: ई-फ़ाइलिंग पोर्टल से AIS और फ़ॉर्म 26AS डाउनलोड करें और हर ब्याज, डिविडेंड और TDS मिलाएँ।"]) };
  },
  how: L("For income earned in FY 2025-26 (filed in 2026). ITR-1/ITR-2 are due 31 July; ITR-3/ITR-4 without audit 31 August (from Budget 2026). New forms under the Income-tax Act 2025 come for Tax Year 2026-27, filed in 2027.",
    "वित्त वर्ष 2025-26 की आय (2026 में फ़ाइल) के लिए। ITR-1/ITR-2: 31 जुलाई; बिना ऑडिट ITR-3/ITR-4: 31 अगस्त (बजट 2026 से)। आयकर अधिनियम 2025 के नए फ़ॉर्म टैक्स ईयर 2026-27 के लिए 2027 में आएँगे।") },

{ id: "f15", cat: "help", ic: "📄", n: L("Form 15G or 15H?", "फ़ॉर्म 15G या 15H?"), d: L("Stop TDS on interest, if you're eligible", "पात्र हों तो ब्याज पर TDS रोकें"),
  k: "15g 15h form tds stop senior citizen", p: ["sen", "first"], rel: ["tds", "scss", "fd"],
  in: [
    { id: "age", t: "num", l: L("Your age", "आपकी उम्र"), v: 64 },
    { id: "inc", t: "money", l: L("Total estimated income this year (incl. interest)", "इस साल अनुमानित कुल आय (ब्याज सहित)"), v: 900000 },
    { id: "i", t: "money", l: L("Of which, interest", "इसमें ब्याज"), v: 400000 }
  ],
  run(v) {
    const sen = v.age >= 60, tax = newRegimeTax(v.inc).total, ok = tax === 0, form = sen ? "15H" : "15G", extra = !sen && v.i > 400000 && false;
    const g = !sen && v.inc > 400000;
    return { bl: L("You can submit", "आप जमा कर सकते हैं"), big: ok && !g ? "Form " + form : T(["Not eligible", "पात्र नहीं"]),
      bw: ok && !g ? T(["Your estimated tax is nil, so you can ask the bank not to deduct TDS.", "आपका अनुमानित टैक्स शून्य है, इसलिए बैंक से TDS न काटने को कह सकते हैं।"]) : T(["Your total income is taxable, so a false declaration would be an offence. Let TDS be deducted and settle in your ITR.", "आपकी कुल आय टैक्स योग्य है; ग़लत घोषणा अपराध है। TDS कटने दें और ITR में हिसाब करें।"]),
      rows: [[L("Estimated tax (new regime)", "अनुमानित टैक्स (नई व्यवस्था)"), inr(tax)], [L("Form for your age", "आपकी उम्र का फ़ॉर्म"), form]],
      verdict: T(["Submit at the start of each financial year (April) to every bank where you hold FDs. Most banks accept it online through net banking.", "हर वित्त वर्ष की शुरुआत (अप्रैल) में हर उस बैंक में जमा करें जहाँ FD है। ज़्यादातर बैंक नेट बैंकिंग से ऑनलाइन लेते हैं।"]) };
  },
  how: L("Form 15H (60+): allowed if the tax on your estimated total income is nil after rebate. Form 15G (below 60): tax must be nil and total income should not exceed the basic exemption limit. Checked here with the new regime.",
    "फ़ॉर्म 15H (60+): अनुमानित कुल आय पर रिबेट के बाद टैक्स शून्य हो। फ़ॉर्म 15G (60 से कम): टैक्स शून्य हो और कुल आय मूल छूट सीमा से ज़्यादा न हो। यहाँ नई व्यवस्था से जाँचा गया।") },

/* ---------------- SAVE & INVEST ---------------- */
{ id: "fd", cat: "save", ic: "🏦", n: L("FD calculator (real return)", "FD कैलकुलेटर (असली रिटर्न)"), d: L("Maturity, tax and return after inflation", "मैच्योरिटी, टैक्स, महँगाई के बाद रिटर्न"),
  k: "fd fixed deposit calculator interest maturity byaj real return", p: ["sen", "sal", "first"], rel: ["tds", "rd", "splitter"], go: "rates",
  in: [
    { id: "P", t: "money", l: L("Amount", "रकम"), v: 500000 },
    { id: "r", t: "pct", l: L("Interest rate (% a year)", "ब्याज दर (% सालाना)"), v: 7.25 },
    { id: "n", t: "num", l: L("Years", "साल"), v: 3 },
    { id: "sl", t: "sel", l: L("Your tax slab", "आपका टैक्स स्लैब"), o: SLABS, v: 20 },
    { id: "inf", t: "pct", l: L("Inflation assumed", "मान ली गई महँगाई"), v: 4 }
  ],
  run(v) {
    const M = fv(v.P, v.r, v.n, 4), I = M - v.P, tax = I * v.sl / 100 * (v.sl ? 1.04 : 1), keep = M - tax;
    const post = Math.pow(keep / v.P, 1 / v.n) - 1, real = (1 + post) / (1 + v.inf / 100) - 1;
    return { bl: L("You get back (after tax)", "टैक्स के बाद वापस"), big: inr(keep), bw: words(keep),
      rows: [[L("Interest earned", "कमाया ब्याज"), inr(I)], [L("Tax on interest", "ब्याज पर टैक्स"), inr(tax)], [L("Return after tax", "टैक्स के बाद रिटर्न"), pct(post * 100) + T([" a year", " सालाना"])], [L("After inflation", "महँगाई के बाद"), pct(real * 100) + T([" a year", " सालाना"])]],
      bar: [[L("Your money", "आपका पैसा"), v.P, "#ffffff"], [L("Interest you keep", "आपका ब्याज"), I - tax, "#ffb547"], [L("Tax", "टैक्स"), tax, "#ff7b7b"]],
      verdict: real < .005 ? T([`⚠️ After tax and inflation your money barely grows: ${pct(v.r)} becomes ${pct(real * 100)}.`, `⚠️ टैक्स और महँगाई के बाद पैसा लगभग नहीं बढ़ता: ${pct(v.r)} असल में ${pct(real * 100)}।`]) :
        real < .02 ? T([`👍 A little ahead of inflation. Tax takes ${inr(tax)} of your ${inr(I)} interest.`, `👍 महँगाई से थोड़ा आगे। टैक्स ने ${inr(I)} ब्याज में से ${inr(tax)} लिया।`]) : T([`✅ Comfortably ahead of inflation: ${pct(real * 100)} real growth a year.`, `✅ महँगाई से अच्छा आगे: सालाना ${pct(real * 100)} असली बढ़त।`]) };
  },
  how: L("Interest compounds quarterly, as most Indian banks do. FD interest is added to your income and taxed at your slab rate (plus 4% cess), whether or not TDS was cut. Real return = after-tax growth adjusted for inflation.",
    "ज़्यादातर भारतीय बैंकों की तरह ब्याज तिमाही चक्रवृद्धि। FD ब्याज आपकी आय में जुड़कर स्लैब दर (+4% सेस) से टैक्स होता है, TDS कटे या न कटे। असली रिटर्न = टैक्स के बाद बढ़त, महँगाई घटाकर।") },

{ id: "splitter", cat: "save", ic: "🛡️", n: L("DICGC-safe FD splitter", "DICGC-सुरक्षित FD बँटवारा"), d: L("Keep every rupee insured across banks", "हर रुपया बीमित रखें"),
  k: "dicgc insurance 5 lakh split fd safe bank fail", p: ["sen", "sal"], rel: ["fd", "scss", "tds"],
  in: [
    { id: "P", t: "money", l: L("Total amount to invest", "कुल निवेश रकम"), v: 2000000 },
    { id: "r", t: "pct", l: L("Typical FD rate", "आम FD दर"), v: 7.5 },
    { id: "n", t: "num", l: L("Years", "साल"), v: 3 }
  ],
  run(v) {
    const grow = fv(1, v.r, v.n, 4), per = Math.floor(500000 / grow / 1000) * 1000, k = Math.max(1, Math.ceil(v.P / per));
    const ten = v.n >= 5 ? 5 : v.n >= 3 ? 3 : v.n >= 2 ? 2 : 1, banks = BANKS.filter(b => b.r[ten] != null).sort((a, b) => b.r[ten] - a.r[ten]);
    let left = v.P; const rows = [];
    for (let i = 0; i < k; i++) { const put = Math.min(per, left); left -= put; const b = banks[i % banks.length]; rows.push([b.s + " · " + pct(b.r[ten]), inr(put), inr(fv(put, v.r, v.n, 4))]); }
    return { bl: L("Split across", "इतने बैंकों में बाँटें"), big: k + T([k > 1 ? " banks" : " bank", " बैंक"]), bw: T([`Up to ${inr(per)} per bank keeps the maturity value within ₹5 lakh`, `हर बैंक में ${inr(per)} तक रखें ताकि मैच्योरिटी ₹5 लाख के अंदर रहे`]),
      table: { head: [L("Bank · rate", "बैंक · दर"), L("Put in", "जमा"), L("Maturity", "मैच्योरिटी")], rows },
      verdict: T(["DICGC insures up to ₹5 lakh per person per bank, principal and interest together. Different branches of the same bank count as one bank. Joint accounts are insured separately.", "DICGC प्रति व्यक्ति प्रति बैंक ₹5 लाख तक (मूलधन + ब्याज) बीमा देता है। एक ही बैंक की अलग शाखाएँ एक बैंक मानी जाती हैं। जॉइंट खाते अलग से बीमित।"]) };
  },
  how: L("We work out the most you can deposit in one bank so that principal plus interest at maturity stays within ₹5 lakh, then spread the rest across banks in order of their current rate for that term.",
    "हम निकालते हैं कि एक बैंक में अधिकतम कितना रखें कि मैच्योरिटी पर मूलधन + ब्याज ₹5 लाख के अंदर रहे, फिर बाकी रकम उस अवधि की मौजूदा दर के क्रम में बैंकों में बाँटते हैं।") },

{ id: "rd", cat: "save", ic: "🪙", n: L("RD calculator", "RD कैलकुलेटर"), d: L("Monthly savings with a bank or post office", "बैंक या डाकघर में मासिक बचत"),
  k: "rd recurring deposit monthly", p: ["first", "sal"], rel: ["fd", "sip", "goal"],
  in: [{ id: "M", t: "money", l: L("Monthly deposit", "मासिक जमा"), v: 5000 }, { id: "r", t: "pct", l: L("Interest rate", "ब्याज दर"), v: SMALL.rd, h: L(`Post office 5-year RD: ${SMALL.rd}%`, `डाकघर 5-साल RD: ${SMALL.rd}%`) }, { id: "m", t: "num", l: L("Months", "महीने"), v: 60 }],
  run(v) { let M = 0; for (let k = 1; k <= v.m; k++) M += v.M * Math.pow(1 + v.r / 400, (v.m - k + 1) / 3); const dep = v.M * v.m;
    return { bl: L("Maturity value", "मैच्योरिटी रकम"), big: inr(M), bw: words(M), rows: [[L("You deposit", "आप जमा करेंगे"), inr(dep)], [L("Interest", "ब्याज"), inr(M - dep)]],
      bar: [[L("Deposits", "जमा"), dep, "#ffffff"], [L("Interest", "ब्याज"), M - dep, "#ffb547"]], verdict: T(["RD interest is taxable like FD interest.", "RD ब्याज भी FD ब्याज की तरह टैक्स योग्य है।"]) }; },
  how: L("Each instalment earns interest compounded quarterly for the months it stays deposited.", "हर किस्त जितने महीने जमा रहती है, उतने समय तिमाही चक्रवृद्धि ब्याज कमाती है।") },

{ id: "ppf", cat: "save", ic: "🌱", n: L("PPF calculator", "PPF कैलकुलेटर"), d: L(`15 years at ${SMALL.ppf}%, tax-free`, `${SMALL.ppf}% पर 15 साल, टैक्स-फ़्री`),
  k: "ppf public provident fund 15 years tax free", p: ["sal", "first", "biz"], rel: ["ssy", "nps", "fd"],
  in: [{ id: "D", t: "money", l: L("Yearly deposit (max ₹1.5 lakh)", "सालाना जमा (अधिकतम ₹1.5 लाख)"), v: 150000 }, { id: "r", t: "pct", l: L("Interest rate", "ब्याज दर"), v: SMALL.ppf }, { id: "n", t: "sel", l: L("Duration", "अवधि"), o: [[15, ["15 years", "15 साल"]], [20, ["20 years (one extension)", "20 साल (एक एक्सटेंशन)"]], [25, ["25 years", "25 साल"]]], v: 15 }],
  run(v) { const D = Math.min(v.D, 150000); let B = 0; for (let y = 1; y <= v.n; y++) B = (B + D) * (1 + v.r / 100); const dep = D * v.n;
    return { bl: L("Maturity (tax-free)", "मैच्योरिटी (टैक्स-फ़्री)"), big: inr(B), bw: words(B), rows: [[L("Total deposited", "कुल जमा"), inr(dep)], [L("Interest earned", "ब्याज"), inr(B - dep)]],
      bar: [[L("Deposits", "जमा"), dep, "#ffffff"], [L("Interest", "ब्याज"), B - dep, "#ffb547"]],
      verdict: T(["Deposit before 5 April each year to earn interest for the full year. Deposits qualify for 80C only in the old regime; interest and maturity are tax-free in both.", "पूरे साल का ब्याज पाने के लिए हर साल 5 अप्रैल से पहले जमा करें। 80C छूट सिर्फ़ पुरानी व्यवस्था में; ब्याज और मैच्योरिटी दोनों में टैक्स-फ़्री।"]) }; },
  how: L("Interest is compounded yearly; we assume each year's deposit is made by 5 April. Rate is set by the government every quarter.", "ब्याज सालाना चक्रवृद्धि; मान लिया कि हर साल 5 अप्रैल तक जमा। दर सरकार हर तिमाही तय करती है।") },

{ id: "ssy", cat: "save", ic: "👧", n: L("Sukanya Samriddhi (SSY)", "सुकन्या समृद्धि (SSY)"), d: L(`For a daughter under 10, at ${SMALL.ssy}%`, `10 साल से छोटी बेटी के लिए, ${SMALL.ssy}%`),
  k: "ssy sukanya samriddhi daughter girl child beti", p: ["sal", "first"], rel: ["child", "ppf", "goal"],
  in: [{ id: "D", t: "money", l: L("Yearly deposit (₹250 to ₹1.5 lakh)", "सालाना जमा (₹250 से ₹1.5 लाख)"), v: 100000 }, { id: "a", t: "num", l: L("Daughter's age now", "बेटी की अभी उम्र"), v: 3 }, { id: "r", t: "pct", l: L("Interest rate", "ब्याज दर"), v: SMALL.ssy }],
  run(v) { if (v.a > 10) return { bl: L("Not eligible", "पात्र नहीं"), big: "—", bw: T(["SSY can be opened only before the girl turns 10.", "SSY सिर्फ़ 10 साल की उम्र से पहले खुल सकता है।"]) };
    const D = clamp(v.D, 250, 150000); let B = 0; for (let y = 1; y <= 21; y++) { if (y <= 15) B += D; B *= 1 + v.r / 100; }
    return { bl: L("Maturity when she is " + (v.a + 21), "मैच्योरिटी (उम्र " + (v.a + 21) + ")"), big: inr(B), bw: words(B),
      rows: [[L("You deposit (15 years)", "आप जमा करेंगे (15 साल)"), inr(D * 15)], [L("Interest (tax-free)", "ब्याज (टैक्स-फ़्री)"), inr(B - D * 15)], [L("Maturity year", "मैच्योरिटी वर्ष"), new Date().getFullYear() + 21], [L("50% can be withdrawn at", "50% निकासी"), T(["age 18, for education", "18 साल पर, पढ़ाई के लिए"])]],
      bar: [[L("Deposits", "जमा"), D * 15, "#ffffff"], [L("Interest", "ब्याज"), B - D * 15, "#ffb547"]] }; },
  how: L("Deposits for 15 years from opening; the account matures 21 years after opening. Interest compounds yearly at the current rate (assumed unchanged).", "खुलने से 15 साल तक जमा; खुलने के 21 साल बाद मैच्योरिटी। मौजूदा दर पर सालाना चक्रवृद्धि (दर स्थिर मानी)।") },

{ id: "scss", cat: "save", ic: "👴", n: L("Senior Citizens Savings Scheme", "वरिष्ठ नागरिक बचत योजना (SCSS)"), d: L(`Quarterly income at ${SMALL.scss}%`, `${SMALL.scss}% पर तिमाही आय`),
  k: "scss senior citizen savings scheme quarterly interest retired", p: ["sen"], rel: ["mis", "tds", "f15"],
  in: [{ id: "P", t: "money", l: L("Amount (max ₹30 lakh)", "रकम (अधिकतम ₹30 लाख)"), v: 1500000 }, { id: "r", t: "pct", l: L("Interest rate", "ब्याज दर"), v: SMALL.scss }],
  run(v) { const P = Math.min(v.P, 3000000), q = P * v.r / 400;
    return { bl: L("Every quarter", "हर तिमाही"), big: inr(q), bw: T([`≈ ${inr(q / 3)} a month · ${inr(q * 4)} a year`, `≈ ${inr(q / 3)} महीना · ${inr(q * 4)} सालाना`]),
      rows: [[L("Invested", "निवेश"), inr(P)], [L("Interest over 5 years", "5 साल का ब्याज"), inr(q * 20)], [L("Paid on", "भुगतान"), T(["1 Apr, 1 Jul, 1 Oct, 1 Jan", "1 अप्रैल, 1 जुलाई, 1 अक्टूबर, 1 जनवरी"])], [L("TDS above", "TDS सीमा"), inr(100000) + T(["/yr", "/साल"])]],
      verdict: v.P > 3000000 ? T(["Capped at ₹30 lakh per person. A spouse aged 60+ can open their own account.", "प्रति व्यक्ति ₹30 लाख सीमा। 60+ जीवनसाथी अपना अलग खाता खोल सकते हैं।"]) : T(["Rate is locked for 5 years when you invest. Interest is taxable.", "निवेश के समय दर 5 साल के लिए तय। ब्याज टैक्स योग्य है।"]) }; },
  how: L("Simple interest paid every quarter; principal returned after 5 years (extendable by 3 years). For 60+ (55+ for some retirees).", "हर तिमाही साधारण ब्याज; 5 साल बाद मूलधन वापस (3 साल बढ़ा सकते हैं)। 60+ के लिए (कुछ सेवानिवृत्तों के लिए 55+)।") },

{ id: "mis", cat: "save", ic: "📮", n: L("Post Office Monthly Income Scheme", "डाकघर मासिक आय योजना (MIS)"), d: L(`Monthly income at ${SMALL.mis}%`, `${SMALL.mis}% पर मासिक आय`),
  k: "post office mis monthly income scheme", p: ["sen"], rel: ["scss", "fd", "swp"],
  in: [{ id: "P", t: "money", l: L("Amount (₹9 lakh single, ₹15 lakh joint)", "रकम (₹9 लाख एकल, ₹15 लाख जॉइंट)"), v: 900000 }, { id: "j", t: "sel", l: L("Account type", "खाता प्रकार"), o: [["s", ["Single", "एकल"]], ["j", ["Joint", "जॉइंट"]]], v: "s" }],
  run(v) { const P = Math.min(v.P, v.j === "j" ? 1500000 : 900000), m = P * SMALL.mis / 1200;
    return { bl: L("Every month", "हर महीने"), big: inr(m), bw: T([`${inr(m * 12)} a year for 5 years`, `5 साल तक ${inr(m * 12)} सालाना`]), rows: [[L("Invested", "निवेश"), inr(P)], [L("Rate", "दर"), pct(SMALL.mis, 1)]],
      verdict: T(["Interest is taxable; no TDS by the post office, so include it in your ITR.", "ब्याज टैक्स योग्य; डाकघर TDS नहीं काटता, इसलिए ITR में दिखाएँ।"]) }; },
  how: L("Simple interest paid monthly for 5 years, then principal returned.", "5 साल तक मासिक साधारण ब्याज, फिर मूलधन वापस।") },

{ id: "nsc", cat: "save", ic: "📜", n: L("NSC calculator", "NSC कैलकुलेटर"), d: L(`5 years at ${SMALL.nsc}%`, `${SMALL.nsc}% पर 5 साल`),

{ id: "epf", cat: "save", ic: "🏛️", n: L("EPF calculator", "EPF कैलकुलेटर"), d: L(`Your PF at retirement, at ${SMALL.epf}%`, `${SMALL.epf}% पर रिटायरमेंट तक PF`),
  k: "epf pf provident fund retirement uan", p: ["sal", "first"], rel: ["inhand", "nps", "retire"],
  in: [{ id: "b", t: "money", l: L("Basic + DA (monthly)", "बेसिक + DA (मासिक)"), v: 40000 }, { id: "a", t: "num", l: L("Your age", "आपकी उम्र"), v: 28 }, { id: "bal", t: "money", l: L("Current EPF balance", "अभी EPF बैलेंस"), v: 200000 }, { id: "g", t: "pct", l: L("Yearly salary increase", "सालाना वेतन बढ़ोतरी"), v: 6 }, { id: "r", t: "pct", l: L("EPF interest rate", "EPF ब्याज दर"), v: SMALL.epf }],
  run(v) { let B = v.bal, b = v.b, tot = 0; const yrsLeft = Math.max(0, 58 - v.a);
    for (let y = 0; y < yrsLeft; y++) { for (let m = 0; m < 12; m++) { const c = b * .12 + Math.max(0, b * .12 - .0833 * Math.min(b, 15000)); B = B * (1 + v.r / 1200) + c; tot += c; } b *= 1 + v.g / 100; }
    return { bl: L("EPF at age 58", "58 साल पर EPF"), big: inr(B), bw: words(B), rows: [[L("Years to go", "बाकी साल"), yrsLeft], [L("Contributions", "योगदान"), inr(tot)], [L("Interest", "ब्याज"), inr(B - tot - v.bal)], [L("Monthly now (you + employer)", "अभी मासिक (आप + नियोक्ता)"), inr(v.b * .12 + Math.max(0, v.b * .12 - .0833 * Math.min(v.b, 15000)))]],
      verdict: T(["Part of the employer's 12% (8.33% of up to ₹15,000) goes to the pension scheme (EPS), not your EPF balance.", "नियोक्ता के 12% में से एक हिस्सा (₹15,000 तक का 8.33%) पेंशन योजना (EPS) में जाता है, EPF बैलेंस में नहीं।"]) }; },
  how: L("You pay 12% of basic + DA; employer pays 12%, of which 8.33% of up to ₹15,000 goes to EPS. Interest assumed monthly at the declared rate.", "आप बेसिक + DA का 12% देते हैं; नियोक्ता 12%, जिसमें ₹15,000 तक का 8.33% EPS में। घोषित दर पर मासिक ब्याज माना गया।") },

{ id: "nps", cat: "save", ic: "🧓", n: L("NPS calculator", "NPS कैलकुलेटर"), d: L("Corpus, lump sum and pension at 60", "60 पर कॉर्पस, एकमुश्त और पेंशन"),
  k: "nps national pension system pension annuity tier 1", p: ["sal", "first"], rel: ["retire", "epf", "regime"],
  in: [{ id: "c", t: "money", l: L("Monthly contribution", "मासिक योगदान"), v: 5000 }, { id: "a", t: "num", l: L("Your age", "आपकी उम्र"), v: 30 }, { id: "r", t: "pct", l: L("Expected return", "अपेक्षित रिटर्न"), v: 10 }, { id: "an", t: "pct", l: L("Share used for pension (annuity)", "पेंशन (एन्युटी) में हिस्सा"), v: 20, h: L("Non-government: minimum 20% if corpus is above ₹12 lakh", "गैर-सरकारी: कॉर्पस ₹12 लाख से ज़्यादा हो तो कम से कम 20%") }, { id: "ar", t: "pct", l: L("Annuity rate", "एन्युटी दर"), v: 6.5 }],
  run(v) { const m = Math.max(0, 60 - v.a) * 12, C = sipFV(v.c, v.r, m), an = Math.max(v.an, C > 1200000 ? 20 : 0) / 100, ls = C * (1 - an), pen = C * an * v.ar / 1200;
    return { bl: L("Corpus at 60", "60 पर कॉर्पस"), big: inr(C), bw: words(C), rows: [[L("Lump sum (tax-free up to 60%)", "एकमुश्त (60% तक टैक्स-फ़्री)"), inr(ls)], [L("Monthly pension", "मासिक पेंशन"), inr(pen)], [L("You invest", "आप लगाएँगे"), inr(v.c * m)], [L("Growth", "बढ़त"), inr(C - v.c * m)]],
      verdict: T(["Returns are not guaranteed; they depend on the market. Extra ₹50,000 deduction for your own NPS is only in the old regime; employer NPS is deductible in both.", "रिटर्न गारंटीड नहीं, बाज़ार पर निर्भर। अपने NPS पर अतिरिक्त ₹50,000 छूट सिर्फ़ पुरानी व्यवस्था में; नियोक्ता NPS दोनों में।"]) }; },
  how: L("From December 2025, non-government subscribers can take up to 80% as a lump sum if the corpus is above ₹12 lakh (minimum 20% annuity); corpus up to ₹8 lakh can be withdrawn fully. Pension estimate = annuity part × annuity rate.",
    "दिसंबर 2025 से गैर-सरकारी सदस्य कॉर्पस ₹12 लाख से ज़्यादा हो तो 80% तक एकमुश्त ले सकते हैं (कम से कम 20% एन्युटी); ₹8 लाख तक पूरा निकाल सकते हैं। पेंशन = एन्युटी हिस्सा × एन्युटी दर।") },

{ id: "sip", cat: "save", ic: "📊", n: L("SIP calculator", "SIP कैलकुलेटर"), d: L("Monthly investing, explained", "हर महीने निवेश, आसान भाषा में"),
  k: "sip mutual fund monthly investment returns", p: ["sal", "first"], rel: ["stepup", "lumpsum", "goal"],
  in: [{ id: "M", t: "money", l: L("Monthly SIP", "मासिक SIP"), v: 10000 }, { id: "r", t: "pct", l: L("Expected return (% a year)", "अपेक्षित रिटर्न (% सालाना)"), v: 12 }, { id: "n", t: "num", l: L("Years", "साल"), v: 15 }],
  run(v) { const F = sipFV(v.M, v.r, v.n * 12), inv = v.M * v.n * 12;
    return { bl: L("Estimated value", "अनुमानित मूल्य"), big: inr(F), bw: words(F), rows: [[L("You invest", "आप लगाएँगे"), inr(inv)], [L("Estimated gain", "अनुमानित लाभ"), inr(F - inv)]],
      bar: [[L("Invested", "निवेश"), inv, "#ffffff"], [L("Growth", "बढ़त"), F - inv, "#ffb547"]],

  how: L("Future value of monthly investments made at the start of each month, compounded monthly at the expected return.", "हर महीने की शुरुआत में निवेश, अपेक्षित रिटर्न पर मासिक चक्रवृद्धि।") },

{ id: "stepup", cat: "save", ic: "🪜", n: L("Step-up SIP", "स्टेप-अप SIP"), d: L("Increase your SIP every year", "हर साल SIP बढ़ाएँ"),
  k: "step up sip top up increase yearly", p: ["sal", "first"], rel: ["sip", "goal", "retire"],
  in: [{ id: "M", t: "money", l: L("Starting monthly SIP", "शुरुआती मासिक SIP"), v: 10000 }, { id: "s", t: "pct", l: L("Increase every year", "हर साल बढ़ोतरी"), v: 10 }, { id: "r", t: "pct", l: L("Expected return", "अपेक्षित रिटर्न"), v: 12 }, { id: "n", t: "num", l: L("Years", "साल"), v: 15 }],
  run(v) { let B = 0, inv = 0, M = v.M; const r = v.r / 1200; for (let y = 0; y < v.n; y++) { for (let m = 0; m < 12; m++) { B = (B + M) * (1 + r); inv += M; } M *= 1 + v.s / 100; }
    const flat = sipFV(v.M, v.r, v.n * 12);
    return { bl: L("Estimated value", "अनुमानित मूल्य"), big: inr(B), bw: words(B), rows: [[L("You invest", "आप लगाएँगे"), inr(inv)], [L("Without step-up", "बिना स्टेप-अप"), inr(flat)], [L("Extra from stepping up", "स्टेप-अप से अतिरिक्त"), inr(B - flat)], [L("Final monthly SIP", "आख़िरी मासिक SIP"), inr(M / (1 + v.s / 100))]] }; },
  how: L("Same as SIP, but the monthly amount rises by the chosen % every 12 months.", "SIP जैसा ही, पर मासिक रकम हर 12 महीने चुने गए % से बढ़ती है।") },

{ id: "lumpsum", cat: "save", ic: "💼", n: L("Lump sum investment", "एकमुश्त निवेश"), d: L("One-time investment growth", "एक बार निवेश की बढ़त"),
  k: "lumpsum one time investment mutual fund compound interest", p: ["sal", "sen"], rel: ["sip", "swp", "inflation"],
  in: [{ id: "P", t: "money", l: L("Amount", "रकम"), v: 500000 }, { id: "r", t: "pct", l: L("Expected return", "अपेक्षित रिटर्न"), v: 10 }, { id: "n", t: "num", l: L("Years", "साल"), v: 10 }],
  run(v) { const F = fv(v.P, v.r, v.n); return { bl: L("Estimated value", "अनुमानित मूल्य"), big: inr(F), bw: words(F), rows: [[L("Gain", "लाभ"), inr(F - v.P)], [L("Money multiplies by", "पैसा इतने गुना"), (F / v.P).toFixed(2) + "×"]],
    verdict: T([`Rule of 72: at ${v.r}% money doubles in about ${(72 / v.r).toFixed(1)} years.`, `72 का नियम: ${v.r}% पर पैसा लगभग ${(72 / v.r).toFixed(1)} साल में दोगुना।`]) }; },
  how: L("Compounded yearly at the expected return.", "अपेक्षित रिटर्न पर सालाना चक्रवृद्धि।") },

{ id: "swp", cat: "save", ic: "🚰", n: L("SWP calculator", "SWP कैलकुलेटर"), d: L("How long will your money last?", "आपका पैसा कितने समय चलेगा?"),
  k: "swp systematic withdrawal plan retirement income monthly", p: ["sen"], rel: ["retire", "scss", "mis"],
  in: [{ id: "P", t: "money", l: L("Corpus", "कॉर्पस"), v: 5000000 }, { id: "w", t: "money", l: L("Monthly withdrawal", "मासिक निकासी"), v: 35000 }, { id: "r", t: "pct", l: L("Expected return", "अपेक्षित रिटर्न"), v: 8 }],
  run(v) { let B = v.P, m = 0; const r = v.r / 1200; while (B > 0 && m < 1200) { B = B * (1 + r) - v.w; m++; }

    return { bl: L("Your money lasts", "पैसा चलेगा"), big: forever ? T(["For ever", "हमेशा"]) : ymo(m), bw: forever ? T(["Your withdrawal is less than the monthly growth", "निकासी मासिक बढ़त से कम है"]) : T([`Total withdrawn: ${inr(v.w * m)}`, `कुल निकासी: ${inr(v.w * m)}`]),
      rows: [[L("Safe monthly amount (never runs out)", "सुरक्षित मासिक रकम (कभी ख़त्म नहीं)"), inr(v.P * r)], [L("Yearly withdrawal", "सालाना निकासी"), inr(v.w * 12)]] }; },
  how: L("Each month the balance grows at the expected return, then your withdrawal is taken out.", "हर महीने बैलेंस अपेक्षित रिटर्न से बढ़ता है, फिर निकासी घटती है।") },

{ id: "goal", cat: "save", ic: "🎯", n: L("Goal planner", "लक्ष्य योजना"), d: L("Monthly saving needed for any goal", "किसी भी लक्ष्य के लिए मासिक बचत"),
  k: "goal planner target car wedding house down payment", p: ["first", "sal"], rel: ["sip", "child", "inflation"],
  in: [{ id: "c", t: "money", l: L("Cost of goal today", "आज लक्ष्य की क़ीमत"), v: 1000000 }, { id: "n", t: "num", l: L("Years away", "कितने साल बाद"), v: 5 }, { id: "i", t: "pct", l: L("Inflation", "महँगाई"), v: 6 }, { id: "r", t: "pct", l: L("Expected return", "अपेक्षित रिटर्न"), v: 10 }, { id: "h", t: "money", l: L("Already saved", "पहले से बचत"), v: 100000 }],
  run(v) { const F = fv(v.c, v.i, v.n), have = fv(v.h, v.r, v.n), need = Math.max(0, F - have), m = sipNeed(need, v.r, v.n * 12);
    return { bl: L("Save every month", "हर महीने बचाएँ"), big: inr(m), bw: T([`Goal will cost ${words(F)} in ${v.n} years`, `${v.n} साल में लक्ष्य की क़ीमत ${words(F)}`]), rows: [[L("Future cost", "भविष्य की क़ीमत"), inr(F)], [L("Your savings grow to", "आपकी बचत बढ़कर"), inr(have)], [L("Gap to fill", "बाकी ज़रूरत"), inr(need)]] }; },
  how: L("Future cost = today's cost grown by inflation. Monthly saving = SIP needed to cover the gap at the expected return.", "भविष्य की क़ीमत = आज की क़ीमत + महँगाई। मासिक बचत = अपेक्षित रिटर्न पर कमी पूरी करने वाली SIP।") },

{ id: "child", cat: "save", ic: "🎓", n: L("Child education planner", "बच्चे की पढ़ाई की योजना"), d: L("College fees in future rupees", "भविष्य में कॉलेज फ़ीस"),
  k: "child education college fees plan", p: ["sal"], rel: ["ssy", "goal", "sip"],
  in: [{ id: "c", t: "money", l: L("Course cost today", "आज कोर्स की लागत"), v: 2000000 }, { id: "a", t: "num", l: L("Child's age", "बच्चे की उम्र"), v: 5 }, { id: "s", t: "num", l: L("Age at college", "कॉलेज की उम्र"), v: 18 }, { id: "i", t: "pct", l: L("Education inflation", "शिक्षा महँगाई"), v: 8 }, { id: "r", t: "pct", l: L("Expected return", "अपेक्षित रिटर्न"), v: 11 }],
  run(v) { const n = Math.max(1, v.s - v.a), F = fv(v.c, v.i, n), m = sipNeed(F, v.r, n * 12), l = F / Math.pow(1 + v.r / 100, n);
    return { bl: L("Save every month", "हर महीने बचाएँ"), big: inr(m), bw: T([`Course will cost about ${words(F)}`, `कोर्स की लागत लगभग ${words(F)}`]), rows: [[L("Years left", "बाकी साल"), n], [L("Or invest today (lump sum)", "या आज एकमुश्त"), inr(l)]],
      verdict: T(["Education costs usually rise faster than general inflation; 8–10% is a common assumption.", "शिक्षा की लागत आम महँगाई से तेज़ बढ़ती है; 8–10% आम अनुमान है।"]) }; },
  how: L("Same as the goal planner, with education inflation.", "लक्ष्य योजना जैसा, शिक्षा महँगाई के साथ।") },

{ id: "retire", cat: "save", ic: "🏖️", n: L("Retirement planner", "रिटायरमेंट योजना"), d: L("How much you need, and how to get there", "कितना चाहिए, और कैसे"),
  k: "retirement corpus planning how much need retire", p: ["sal", "sen"], rel: ["nps", "epf", "swp"],
  in: [{ id: "e", t: "money", l: L("Monthly expenses today", "आज मासिक ख़र्च"), v: 50000 }, { id: "a", t: "num", l: L("Your age", "आपकी उम्र"), v: 32 }, { id: "ra", t: "num", l: L("Retire at", "रिटायरमेंट उम्र"), v: 60 }, { id: "le", t: "num", l: L("Plan until age", "किस उम्र तक योजना"), v: 85 }, { id: "i", t: "pct", l: L("Inflation", "महँगाई"), v: 6 }, { id: "r1", t: "pct", l: L("Return before retirement", "रिटायरमेंट से पहले रिटर्न"), v: 11 }, { id: "r2", t: "pct", l: L("Return after retirement", "रिटायरमेंट के बाद रिटर्न"), v: 7.5 }, { id: "h", t: "money", l: L("Savings so far", "अब तक बचत"), v: 500000 }],
  run(v) { const n = Math.max(1, v.ra - v.a), yrsR = Math.max(1, v.le - v.ra), E = v.e * 12 * Math.pow(1 + v.i / 100, n);

    return { bl: L("Corpus needed at " + v.ra, v.ra + " पर ज़रूरी कॉर्पस"), big: inr(corpus), bw: words(corpus), rows: [[L("Monthly expenses at retirement", "रिटायरमेंट पर मासिक ख़र्च"), inr(E / 12)], [L("Your savings grow to", "आपकी बचत बढ़कर"), inr(have)], [L("Save every month", "हर महीने बचाएँ"), inr(m)], [L("Years to retirement", "रिटायरमेंट तक साल"), n]] }; },

{ id: "inflation", cat: "save", ic: "🎈", n: L("Inflation calculator", "महँगाई कैलकुलेटर"), d: L("What today's money will be worth", "आज का पैसा भविष्य में कितना"),

{ id: "homeemi", cat: "loan", ic: "🏠", n: L("Home loan EMI", "होम लोन EMI"), d: L("EMI, total interest, yearly schedule", "EMI, कुल ब्याज, सालाना तालिका"),

  how: L("Standard reducing-balance EMI: E = P·r·(1+r)ⁿ / ((1+r)ⁿ − 1), with r the monthly rate.", "मानक घटते बकाया EMI: E = P·r·(1+r)ⁿ / ((1+r)ⁿ − 1), r = मासिक दर।") },

{ id: "prepay", cat: "loan", ic: "⚡", n: L("Loan prepayment savings", "लोन प्रीपेमेंट बचत"), d: L("Interest saved by paying extra", "अतिरिक्त भुगतान से बचा ब्याज"),

{ id: "transfer", cat: "loan", ic: "🔁", n: L("Balance transfer savings", "बैलेंस ट्रांसफ़र बचत"), d: L("Is switching banks worth it?", "बैंक बदलना फ़ायदेमंद?"),

{ id: "minbal", cat: "day", ic: "🏧", n: L("Minimum balance penalty check", "मिनिमम बैलेंस जुर्माना जाँच"), d: L("Is your bank still fining you?", "क्या बैंक अब भी जुर्माना काटता है?"), k: "minimum balance penalty charges bank fine average monthly balance zero balance", p: ["first", "sen", "sal"], rel: ["savings", "complaint"],

{ id: "complaint", cat: "help", ic: "✉️", n: L("Bank complaint letter (RBI Ombudsman)", "बैंक शिकायत पत्र (RBI लोकपाल)"), d: L("Step by step, ready to send. Nothing stored.", "स्टेप बाय स्टेप, भेजने को तैयार। कुछ सेव नहीं होता।"), k: "complaint rbi ombudsman bank shikayat letter cms", p: ["sen", "sal", "first", "biz"], rel: ["fraud", "minbal"], wide: true,
  in: [{ id: "name", t: "txt", l: L("Your name", "आपका नाम"), v: "" }, { id: "bank", t: "txt", l: L("Bank and branch", "बैंक और शाखा"), v: "" }, { id: "acc", t: "txt", l: L("Account / card (last 4 digits only)", "खाता / कार्ड (सिर्फ़ आख़िरी 4 अंक)"), v: "" },
    { id: "type", t: "sel", l: L("Problem", "समस्या"), o: [["charges", ["Wrong or excessive charges", "ग़लत या ज़्यादा शुल्क"]], ["fraud", ["Unauthorised / fraud transaction", "अनधिकृत / धोखाधड़ी लेन-देन"]], ["atm", ["ATM/UPI debit but money not received", "ATM/UPI से कटा पर पैसा नहीं मिला"]], ["loan", ["Loan or recovery agent issue", "लोन या रिकवरी एजेंट की समस्या"]], ["service", ["Poor service / no response", "ख़राब सेवा / जवाब नहीं"]]], v: "charges" },
    { id: "date", t: "txt", l: L("Date of the problem", "समस्या की तारीख़"), v: "" }, { id: "amt", t: "money", l: L("Amount involved", "संबंधित रकम"), v: 0 }, { id: "det", t: "area", l: L("What happened (in short)", "क्या हुआ (संक्षेप में)"), v: "" }, { id: "stage", t: "sel", l: L("Stage", "चरण"), o: [["bank", ["First complaint to the bank", "बैंक को पहली शिकायत"]], ["rbi", ["Bank didn't resolve in 30 days → RBI", "30 दिन में हल नहीं → RBI"]]], v: "bank" }],
  run(v) { const P = { charges: "levied charges that I believe are wrong / not as per RBI rules", fraud: "debited my account through a transaction I did not authorise", atm: "debited my account for a failed ATM/UPI transaction, and the money has not been credited back", loan: "handled my loan / recovery in a way that breaches RBI's Fair Practices Code", service: "not responded to or resolved my request" }[v.type];
    const tat = v.type === "atm" ? "\nAs per RBI's Turnaround Time framework, failed transactions must be reversed within the prescribed time (T+1 to T+5 days), failing which compensation of ₹100 per day of delay is payable." : v.type === "fraud" ? "\nI reported this to the bank promptly. Under RBI's customer liability rules, my liability is zero where the fraud is reported within three working days and I have not been negligent." : "";
    const n = v.name || "[Your name]", b = v.bank || "[Bank, branch]", today = new Date().toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
    const letter = v.stage === "bank" ?
`To,

${b}

Date: ${today}

Subject: Complaint regarding account/card ending ${v.acc || "XXXX"}

Dear Sir/Madam,

I hold an account/card ending ${v.acc || "XXXX"} with your bank. On ${v.date || "[date]"}, the bank ${P}${v.amt ? ", involving " + inr(v.amt) : ""}.

${v.det || "[Brief details]"}${tat}

Yours faithfully,
${n}` :
`COMPLAINT SUMMARY FOR RBI (file at cms.rbi.org.in, or call 14448)

Complainant: ${n}
Bank / branch: ${b}
Account / card: ending ${v.acc || "XXXX"}

Complaint: The bank ${P}.
${v.det || "[Brief details]"}${tat}

Relief sought: Refund of ${v.amt ? inr(v.amt) : "the amount"} with interest/compensation as per RBI rules.

Attach: your complaint to the bank, the bank's reply (if any), statement page showing the transaction.`;
    return { bl: v.stage === "bank" ? L("Your letter to the bank", "बैंक को आपका पत्र") : L("Your RBI complaint summary", "आपका RBI शिकायत सार"), big: v.stage === "bank" ? T(["Step 1: complain to the bank", "चरण 1: बैंक में शिकायत"]) : T(["Step 2: RBI Ombudsman", "चरण 2: RBI लोकपाल"]), pre: letter, copy: true,
      verdict: T(["Never share your full account number, card number, CVV, OTP or PIN with anyone, including in this letter.", "कभी भी पूरा खाता नंबर, कार्ड नंबर, CVV, OTP या PIN किसी को न दें, इस पत्र में भी नहीं।"]) }; },
  how: L("First complain to the bank in writing. If it doesn't reply in 30 days, or you're unhappy with the reply, complain free of charge to the RBI Ombudsman online at cms.rbi.org.in within a year of the bank's reply. Your letter is built in your browser; nothing is sent or saved.",
    "पहले बैंक को लिखित शिकायत दें। 30 दिन में जवाब न मिले या जवाब से संतुष्ट न हों, तो बैंक के जवाब के एक साल के अंदर cms.rbi.org.in पर RBI लोकपाल को मुफ़्त शिकायत करें। पत्र आपके ब्राउज़र में बनता है; कुछ भेजा या सेव नहीं होता।") }
];

  ins: { ic: "🛡️", n: ["Insurance", "बीमा"] }, inv: { ic: "📈", n: ["Investing basics", "निवेश की बुनियाद"] }, tax: { ic: "🧾", n: ["Tax", "टैक्स"] }, safe: { ic: "🚨", n: ["Fraud & your rights", "धोखाधड़ी और आपके अधिकार"] }

{ id: "dicgc", tp: "bank", ic: "🛡️", t: ["Is my money safe if a bank fails?", "बैंक डूबे तो क्या मेरा पैसा सुरक्षित है?"], s: ["DICGC insurance covers ₹5 lakh per person, per bank.", "DICGC बीमा प्रति व्यक्ति, प्रति बैंक ₹5 लाख तक।"], tools: ["splitter", "fd"],
  b: [`<p>Deposits in banks are insured by the Deposit Insurance and Credit Guarantee Corporation (DICGC), a subsidiary of the RBI.</p>
<ul><li><b>Limit:</b> ₹5 lakh per depositor per bank, principal and interest together.</li><li><b>Covered:</b> savings, current, FD and RD in all commercial banks, small finance banks, payments banks, regional rural banks and most co-operative banks.</li><li><b>Not covered:</b> post office schemes (these are backed by the government itself), company/NBFC fixed deposits, mutual funds.</li><li><b>Counts per bank, not per branch.</b> Two branches of SBI = one bank.</li><li>Accounts held in different capacities (single, joint with spouse, as guardian) are insured separately.</li></ul>
<p>If a bank is put under restrictions, DICGC pays eligible depositors within 90 days.</p>
<div class="callout">Holding more than ₹5 lakh? Spread it across banks so each stays under ₹5 lakh including interest. Our splitter does the maths.</div>`,
  `<p>बैंकों में जमा पैसा RBI की सहायक कंपनी DICGC (डिपॉज़िट इंश्योरेंस एंड क्रेडिट गारंटी कॉर्पोरेशन) से बीमित होता है।</p>
<ul><li><b>सीमा:</b> प्रति जमाकर्ता प्रति बैंक ₹5 लाख, मूलधन और ब्याज मिलाकर।</li><li><b>शामिल:</b> सभी कमर्शियल, स्मॉल फ़ाइनेंस, पेमेंट्स, ग्रामीण बैंक और ज़्यादातर सहकारी बैंकों में बचत, चालू, FD और RD।</li><li><b>शामिल नहीं:</b> डाकघर योजनाएँ (इनकी गारंटी सरकार देती है), कंपनी/NBFC FD, म्यूचुअल फ़ंड।</li><li><b>गिनती बैंक के हिसाब से, शाखा के नहीं।</b> SBI की दो शाखाएँ = एक बैंक।</li><li>अलग-अलग हैसियत (एकल, जीवनसाथी के साथ जॉइंट, अभिभावक) वाले खाते अलग से बीमित।</li></ul>
<p>किसी बैंक पर पाबंदी लगने पर DICGC 90 दिन में पात्र जमाकर्ताओं को भुगतान करता है।</p>
<div class="callout">₹5 लाख से ज़्यादा है? बैंकों में बाँटें ताकि ब्याज सहित हर बैंक में ₹5 लाख से कम रहे। हमारा स्प्लिटर हिसाब कर देगा।</div>`], src: "DICGC; RBI" },

{ id: "minbalance", tp: "bank", ic: "🏧", t: ["Minimum balance charges: your rights", "मिनिमम बैलेंस चार्ज: आपके अधिकार"], s: ["Banks took ₹7,086 crore in penalties in FY26. Here's how to stop paying.", "बैंकों ने FY26 में ₹7,086 करोड़ जुर्माना लिया। इसे कैसे रोकें।"], tools: ["minbal", "complaint"],
  b: [`<p>Banks collected about ₹7,086 crore in minimum-balance penalties in FY 2025-26. Most public sector banks have now dropped the penalty on regular savings accounts, but many private banks still charge.</p>
<h3>RBI rules banks must follow</h3><ul><li>You must be told about the shortfall (SMS/email/letter) and given time (usually a month) to restore the balance before any charge.</li><li>The penalty must be proportionate to the shortfall, not a flat amount.</li><li>Penalties can't push your balance below zero.</li><li>Every bank must offer a <b>Basic Savings Bank Deposit (BSBD)</b> account: no minimum balance, free ATM card, at least 4 free withdrawals a month.</li></ul>
<h3>What you can do</h3><ol><li>Check your statement for "non-maintenance" or "MAB" charges.</li><li>Ask the bank to convert your account to BSBD, or move to a bank that doesn't charge.</li><li>If a charge broke the rules, complain to the bank, then to the RBI Ombudsman.</li></ol>`,
  `<p>FY 2025-26 में बैंकों ने मिनिमम बैलेंस जुर्माने में लगभग ₹7,086 करोड़ वसूले। ज़्यादातर सरकारी बैंकों ने सामान्य बचत खाते पर जुर्माना हटा दिया है, पर कई प्राइवेट बैंक अब भी काटते हैं।</p>
<h3>बैंकों को मानने होंगे RBI के नियम</h3><ul><li>कमी की सूचना (SMS/ईमेल/पत्र) देनी होगी और बैलेंस पूरा करने का समय (आम तौर पर एक महीना) देना होगा।</li><li>जुर्माना कमी के अनुपात में हो, फ़्लैट नहीं।</li><li>जुर्माने से बैलेंस माइनस नहीं हो सकता।</li><li>हर बैंक को <b>बेसिक सेविंग्स बैंक डिपॉज़िट (BSBD)</b> खाता देना ज़रूरी: कोई मिनिमम बैलेंस नहीं, मुफ़्त ATM कार्ड, महीने में कम से कम 4 मुफ़्त निकासी।</li></ul>
<h3>आप क्या करें</h3><ol><li>स्टेटमेंट में "non-maintenance" या "MAB" चार्ज देखें।</li><li>बैंक से खाता BSBD में बदलवाएँ, या ऐसे बैंक में जाएँ जो जुर्माना न काटे।</li><li>नियम तोड़कर चार्ज लगा हो तो बैंक में, फिर RBI लोकपाल में शिकायत करें।</li></ol>`], src: "RBI master circular on service charges; Ministry of Finance data (FY26)" },

{ id: "upi", tp: "safe", ic: "📱", t: ["UPI safety: 7 rules", "UPI सुरक्षा: 7 नियम"], s: ["You never need a PIN to receive money.", "पैसा पाने के लिए कभी PIN नहीं चाहिए।"], tools: ["complaint"],
  b: [`<ol><li><b>You never enter your UPI PIN to receive money.</b> A "collect request" asking for your PIN is a payment out.</li><li>Never scan a QR code to receive money. QR codes are for paying.</li><li>Don't install screen-sharing apps (AnyDesk, TeamViewer etc.) at a stranger's request.</li><li>Customer care numbers from Google search can be fake. Use the number on your card or the bank's app.</li><li>Banks, RBI and police never ask for OTP, PIN or CVV.</li><li>Check the receiver's name before paying.</li><li>Set a daily UPI limit in your app that matches what you really spend.</li></ol>
<div class="callout warn">Lost money? Call <b>1930</b> immediately and report at cybercrime.gov.in. Tell your bank within 3 working days: if you weren't negligent, your liability is zero.</div>`,
  `<ol><li><b>पैसा पाने के लिए कभी UPI PIN नहीं डालना होता।</b> PIN माँगने वाला "कलेक्ट रिक्वेस्ट" असल में पैसा भेजना है।</li><li>पैसा पाने के लिए कभी QR कोड स्कैन न करें। QR कोड भुगतान के लिए होता है।</li><li>अजनबी के कहने पर स्क्रीन-शेयरिंग ऐप (AnyDesk, TeamViewer आदि) न डालें।</li><li>Google पर मिले कस्टमर केयर नंबर नक़ली हो सकते हैं। कार्ड या बैंक ऐप पर दिया नंबर ही इस्तेमाल करें।</li><li>बैंक, RBI और पुलिस कभी OTP, PIN या CVV नहीं माँगते।</li><li>भुगतान से पहले पाने वाले का नाम जाँचें।</li><li>ऐप में रोज़ की UPI सीमा अपने असल ख़र्च जितनी रखें।</li></ol>
<div class="callout warn">पैसा गया? तुरंत <b>1930</b> पर कॉल करें और cybercrime.gov.in पर रिपोर्ट करें। 3 कार्य-दिवस में बैंक को बताएँ: लापरवाही न हो तो आपकी ज़िम्मेदारी शून्य।</div>`], src: "RBI customer liability circular (2017); NPCI; Indian Cybercrime Coordination Centre" },

{ id: "fraud", tp: "safe", ic: "🚨", t: ["Lost money to fraud? Do this now", "धोखाधड़ी में पैसा गया? अभी यह करें"], s: ["The first hour matters. Step-by-step.", "पहला घंटा सबसे ज़रूरी। स्टेप बाय स्टेप।"], tools: ["complaint"],
  b: [`<ol><li><b>Call 1930</b> (National Cybercrime Helpline). The sooner you call, the better the chance the money can be frozen.</li><li><b>Block</b> your card/UPI in your bank app or by calling the bank.</li><li><b>Report to your bank in writing</b> (email or app) and keep the reference number. Within 3 working days your liability is zero if you weren't negligent; within 4–7 days it's limited.</li><li><b>File a complaint</b> at cybercrime.gov.in and keep the acknowledgement number.</li><li>The bank must credit the disputed amount (shadow reversal) within 10 working days of your report, and resolve within 90 days.</li><li>If the bank doesn't help in 30 days, complain to the RBI Ombudsman.</li></ol>`,
  `<ol><li><b>1930 पर कॉल करें</b> (राष्ट्रीय साइबर क्राइम हेल्पलाइन)। जितनी जल्दी, पैसा रुकने की उतनी संभावना।</li><li>बैंक ऐप से या बैंक को फ़ोन कर कार्ड/UPI <b>ब्लॉक</b> करें।</li><li><b>बैंक को लिखित में बताएँ</b> (ईमेल या ऐप) और रेफ़रेंस नंबर रखें। 3 कार्य-दिवस में बताने पर, लापरवाही न हो तो ज़िम्मेदारी शून्य; 4–7 दिन में सीमित।</li><li>cybercrime.gov.in पर <b>शिकायत दर्ज करें</b> और पावती नंबर रखें।</li><li>रिपोर्ट के 10 कार्य-दिवस में बैंक को विवादित रकम (शैडो रिवर्सल) जमा करनी होती है और 90 दिन में मामला निपटाना होता है।</li><li>30 दिन में बैंक मदद न करे तो RBI लोकपाल में शिकायत करें।</li></ol>`], src: "RBI circular on limiting liability of customers (2017); cybercrime.gov.in" },

{ id: "ombudsman", tp: "safe", ic: "⚖️", t: ["How to complain to the RBI Ombudsman", "RBI लोकपाल में शिकायत कैसे करें"], s: ["Free, online, no lawyer needed.", "मुफ़्त, ऑनलाइन, वकील की ज़रूरत नहीं।"], tools: ["complaint"],
  b: [`<p>The RBI Integrated Ombudsman handles complaints against banks, NBFCs, payment apps and credit bureaus. It is free.</p><ol><li><b>Complain to the bank first</b>, in writing. Keep the reference number.</li><li>Wait <b>30 days</b>. If there's no reply, or you're not satisfied, go to step 3.</li><li>File at <b>cms.rbi.org.in</b> (or call 14448) within one year of the bank's reply.</li><li>Attach: your complaint to the bank, any reply, and the statement page.</li></ol><p>The Ombudsman can order a refund and compensation for loss, time and harassment. Complaints already in court or consumer forum aren't accepted.</p><div class="callout">Use our letter tool to draft both the bank complaint and the RBI summary.</div>`,
  `<p>RBI एकीकृत लोकपाल बैंकों, NBFC, पेमेंट ऐप और क्रेडिट ब्यूरो के ख़िलाफ़ शिकायतें सुनता है। यह मुफ़्त है।</p><ol><li><b>पहले बैंक में लिखित शिकायत करें</b>। रेफ़रेंस नंबर रखें।</li><li><b>30 दिन</b> इंतज़ार करें। जवाब न मिले या संतुष्ट न हों तो चरण 3।</li><li>बैंक के जवाब के एक साल के अंदर <b>cms.rbi.org.in</b> पर (या 14448 पर कॉल) शिकायत करें।</li><li>साथ लगाएँ: बैंक को शिकायत, कोई जवाब, स्टेटमेंट का पेज।</li></ol><p>लोकपाल रिफ़ंड और नुक़सान, समय और परेशानी के लिए मुआवज़ा दिला सकता है। कोर्ट या उपभोक्ता फ़ोरम में चल रहे मामले नहीं लिए जाते।</p><div class="callout">बैंक शिकायत और RBI सार, दोनों हमारे पत्र टूल से बनाएँ।</div>`], src: "Reserve Bank – Integrated Ombudsman Scheme" },

{ id: "cibil", tp: "loan", ic: "📊", t: ["Credit score (CIBIL) explained", "क्रेडिट स्कोर (CIBIL) समझें"], s: ["What moves it, and how to fix it.", "क्या असर डालता है, कैसे सुधारें।"], tools: ["eligibility", "mindue"],
  b: [`<p>Your credit score (300–900) is how lenders judge you. 750+ usually gets the best rates. India has four bureaus: CIBIL, Experian, Equifax and CRIF High Mark.</p><h3>What matters most</h3><ul><li><b>Paying on time</b>: a single 30-day late payment hurts for years.</li><li><b>Credit card usage</b>: keep it under 30% of your limit.</li><li><b>Age of accounts</b>: don't close your oldest card without reason.</li><li><b>Too many loan applications</b> in a short time lower the score.</li></ul><h3>Your rights</h3><ul><li>One free full credit report a year from each bureau.</li><li>Lenders now report to bureaus every 15 days, so changes show faster.</li><li>Errors must be fixed within 30 days of your complaint, or the bureau and lender pay ₹100 a day compensation.</li></ul>`,
  `<p>क्रेडिट स्कोर (300–900) से ऋणदाता आपको आँकते हैं। 750+ पर आम तौर पर सबसे अच्छी दर मिलती है। भारत में चार ब्यूरो हैं: CIBIL, Experian, Equifax और CRIF हाई मार्क।</p><h3>सबसे ज़रूरी</h3><ul><li><b>समय पर भुगतान</b>: 30 दिन की एक देरी भी सालों असर डालती है।</li><li><b>क्रेडिट कार्ड इस्तेमाल</b>: सीमा के 30% से कम रखें।</li><li><b>खातों की उम्र</b>: बिना वजह सबसे पुराना कार्ड बंद न करें।</li><li><b>कम समय में कई लोन आवेदन</b> स्कोर घटाते हैं।</li></ul><h3>आपके अधिकार</h3><ul><li>हर ब्यूरो से साल में एक मुफ़्त पूरी क्रेडिट रिपोर्ट।</li><li>ऋणदाता अब हर 15 दिन में रिपोर्ट करते हैं, बदलाव जल्दी दिखते हैं।</li><li>शिकायत के 30 दिन में ग़लती ठीक न हो तो ब्यूरो और ऋणदाता ₹100 प्रतिदिन मुआवज़ा देते हैं।</li></ul>`], src: "RBI directions on credit information reporting" },

{ id: "repoloan", tp: "loan", ic: "🏛️", t: ["RBI raised the repo rate: what now for your home loan?", "RBI ने रेपो बढ़ाया: आपके होम लोन का क्या?"], s: [`Repo is now ${REPO.rate}%. Your EMI or tenure will move.`, `रेपो अब ${REPO.rate}%। आपकी EMI या अवधि बदलेगी।`], tools: ["repo", "prepay", "transfer"],
  b: [`<p>On 7 October 2026 the RBI raised the repo rate by 0.25% to ${REPO.rate}%, its first increase since February 2023. Most new home loans are linked to the repo rate (EBLR), so your rate rises by the same amount at the next reset (at least every 3 months).</p><h3>What banks usually do</h3><p>They keep your EMI the same and <b>extend the tenure</b>. That looks painless but adds a lot of interest. You can ask the bank to increase the EMI instead.</p><h3>Options</h3><ul><li>Prepay a little each year: even one extra EMI a year cuts years off a 20-year loan.</li><li>If your rate is well above what new borrowers get, ask your bank to reprice or consider a balance transfer.</li></ul><p>The next RBI policy meeting is 2–4 December 2026.</p>`,
  `<p>7 अक्टूबर 2026 को RBI ने रेपो रेट 0.25% बढ़ाकर ${REPO.rate}% किया, फ़रवरी 2023 के बाद पहली बढ़ोतरी। ज़्यादातर नए होम लोन रेपो से जुड़े (EBLR) हैं, इसलिए अगले रीसेट (कम से कम हर 3 महीने) पर आपकी दर भी उतनी बढ़ेगी।</p><h3>बैंक आम तौर पर क्या करते हैं</h3><p>EMI वही रखकर <b>अवधि बढ़ा देते हैं</b>। यह आसान लगता है पर ब्याज बहुत बढ़ता है। आप बैंक से EMI बढ़ाने को कह सकते हैं।</p><h3>विकल्प</h3><ul><li>हर साल थोड़ा प्रीपेमेंट: साल में एक अतिरिक्त EMI भी 20 साल के लोन से कई साल घटा देती है।</li><li>आपकी दर नए ग्राहकों से काफ़ी ज़्यादा हो तो बैंक से रीप्राइसिंग माँगें या बैलेंस ट्रांसफ़र देखें।</li></ul><p>अगली RBI बैठक 2–4 दिसंबर 2026 को है।</p>`], src: "RBI Monetary Policy Statement, October 2026" },

{ id: "cardtrap", tp: "card", ic: "🪤", t: ["The credit card minimum-due trap", "क्रेडिट कार्ड मिनिमम ड्यू का जाल"], s: ["Why ₹1 lakh can take years and cost ₹1 lakh more.", "₹1 लाख चुकाने में साल और ₹1 लाख ज़्यादा क्यों।"], tools: ["mindue", "ccinterest", "personal"],
  b: [`<p>Card interest in India is typically 3–3.75% a month, about 36–45% a year, plus 18% GST on the interest. Paying only the minimum due (usually 5%) keeps you out of default but barely touches the balance.</p><ul><li>Once you carry a balance, <b>new purchases also attract interest</b> from day one.</li><li>Pay the full "total amount due" by the due date and you pay no interest at all.</li><li>Stuck? A personal loan at 12–15% to clear the card, or the bank's EMI conversion, is much cheaper. Then stop using the card until it's clear.</li></ul>`,
  `<p>भारत में कार्ड ब्याज आम तौर पर 3–3.75% मासिक, यानी लगभग 36–45% सालाना, ऊपर से ब्याज पर 18% GST। सिर्फ़ मिनिमम ड्यू (आम तौर पर 5%) भरने से डिफ़ॉल्ट नहीं होता पर बकाया लगभग नहीं घटता।</p><ul><li>बकाया रहने पर <b>नई ख़रीद पर भी पहले दिन से ब्याज</b> लगता है।</li><li>ड्यू डेट तक पूरा "टोटल अमाउंट ड्यू" भरें तो कोई ब्याज नहीं।</li><li>फँसे हैं? 12–15% का पर्सनल लोन या बैंक की EMI सुविधा कहीं सस्ती है। फिर बकाया ख़त्म होने तक कार्ड न चलाएँ।</li></ul>`], src: "RBI Master Direction on credit cards" },

{ id: "healthins", tp: "ins", ic: "🏥", t: ["Health insurance: 6 terms that decide your claim", "हेल्थ इंश्योरेंस: 6 शब्द जो क्लेम तय करते हैं"], s: ["Room rent caps, waiting periods, co-pay and more.", "रूम रेंट सीमा, वेटिंग पीरियड, को-पे आदि।"], tools: ["health", "term"],
  b: [`<ol><li><b>Room rent limit:</b> take a costlier room and most of the bill is cut in proportion, not just the room. Prefer "no room rent cap" policies.</li><li><b>Pre-existing disease waiting period:</b> now a maximum of 3 years under IRDAI rules.</li><li><b>Moratorium:</b> after 5 continuous years, the insurer can't reject a claim for non-disclosure except for proven fraud.</li><li><b>Co-payment:</b> you pay a fixed % of every claim. Common in senior-citizen policies.</li><li><b>Sub-limits:</b> caps on specific treatments (cataract, knee replacement). Read the schedule.</li><li><b>Cashless vs reimbursement:</b> cashless needs a network hospital. Insurers must decide on cashless discharge within 3 hours.</li></ol><div class="callout">Claim rejected unfairly? Complain to the insurer's grievance officer, then through the IRDAI Bima Bharosa portal, then the Insurance Ombudsman (free).</div>`,
  `<ol><li><b>रूम रेंट सीमा:</b> महँगा कमरा लेने पर ज़्यादातर बिल अनुपात में कटता है, सिर्फ़ कमरा नहीं। "रूम रेंट सीमा नहीं" वाली पॉलिसी लें।</li><li><b>पहले से मौजूद बीमारी का वेटिंग पीरियड:</b> IRDAI नियमों में अब अधिकतम 3 साल।</li><li><b>मोरेटोरियम:</b> लगातार 5 साल बाद, सिद्ध धोखाधड़ी के अलावा, जानकारी न देने पर क्लेम नहीं ठुकराया जा सकता।</li><li><b>को-पेमेंट:</b> हर क्लेम का तय % आप भरते हैं। वरिष्ठ नागरिक पॉलिसी में आम।</li><li><b>सब-लिमिट:</b> ख़ास इलाज (मोतियाबिंद, घुटना) पर सीमा। शेड्यूल पढ़ें।</li><li><b>कैशलेस बनाम रीइम्बर्समेंट:</b> कैशलेस के लिए नेटवर्क अस्पताल ज़रूरी। कैशलेस डिस्चार्ज पर बीमा कंपनी को 3 घंटे में फ़ैसला करना होता है।</li></ol><div class="callout">क्लेम ग़लत ठुकराया? पहले कंपनी के शिकायत अधिकारी, फिर IRDAI बीमा भरोसा पोर्टल, फिर बीमा लोकपाल (मुफ़्त)।</div>`], src: "IRDAI Master Circular on Health Insurance (2024)" },

{ id: "terminsurance", tp: "ins", ic: "☂️", t: ["Term insurance in plain words", "टर्म इंश्योरेंस आसान भाषा में"], s: ["The cheapest way to protect your family.", "परिवार को सुरक्षित करने का सबसे सस्ता तरीका।"], tools: ["term"],
  b: [`<p>Term insurance pays your family a fixed amount if you die during the policy term. It pays nothing if you survive, which is exactly why it's cheap.</p><ul><li>A common starting point is 10–15× your yearly income, plus loans.</li><li>Cover until your expected retirement age, not to 85 or 99.</li><li>Disclose all health conditions and habits honestly; non-disclosure is the top reason claims fail.</li><li>Endowment, money-back and ULIP plans mix insurance with investment; they usually give much less cover for the same premium.</li></ul>`,
  `<p>पॉलिसी अवधि में मृत्यु होने पर टर्म इंश्योरेंस परिवार को तय रकम देता है। जीवित रहने पर कुछ नहीं, इसीलिए सस्ता है।</p><ul><li>शुरुआती अनुमान: सालाना आय का 10–15 गुना, साथ में लोन।</li><li>रिटायरमेंट की उम्र तक कवर लें, 85 या 99 तक नहीं।</li><li>सारी बीमारियाँ और आदतें ईमानदारी से बताएँ; जानकारी छिपाना क्लेम ठुकराए जाने की सबसे बड़ी वजह है।</li><li>एंडोमेंट, मनी-बैक और ULIP बीमा और निवेश मिलाते हैं; उसी प्रीमियम में आम तौर पर बहुत कम कवर।</li></ul>`], src: "IRDAI consumer education" },

{ id: "mf", tp: "inv", ic: "📈", t: ["Mutual funds and SIP: the basics", "म्यूचुअल फ़ंड और SIP: बुनियादी बातें"], s: ["What they are, what they cost, how they're taxed.", "क्या हैं, कितनी लागत, कैसे टैक्स।"], tools: ["sip", "stepup", "capgain"],
  b: [`<p>A mutual fund pools money from many investors and invests it in shares, bonds or both. A SIP is simply investing a fixed amount every month.</p><ul><li><b>Equity funds:</b> higher long-term growth, big short-term ups and downs. For goals 5+ years away.</li><li><b>Debt funds:</b> steadier; since April 2023 gains are taxed at your slab rate, like FDs.</li><li><b>Direct plans</b> have lower costs than regular plans because no distributor commission is paid.</li><li>Check the fund's riskometer and expense ratio.</li></ul><div class="callout warn">No one can guarantee market returns. Anyone promising "assured" returns or tips on Telegram/WhatsApp is a red flag. Check advisers are registered with SEBI.</div><p>Wisecrest doesn't recommend specific funds or shares.</p>`,
  `<p>म्यूचुअल फ़ंड कई निवेशकों का पैसा मिलाकर शेयर, बॉन्ड या दोनों में लगाता है। SIP यानी हर महीने तय रकम निवेश।</p><ul><li><b>इक्विटी फ़ंड:</b> लंबे समय में ज़्यादा बढ़त, कम समय में बड़े उतार-चढ़ाव। 5+ साल के लक्ष्यों के लिए।</li><li><b>डेट फ़ंड:</b> ज़्यादा स्थिर; अप्रैल 2023 से मुनाफ़ा FD की तरह स्लैब दर पर टैक्स।</li><li><b>डायरेक्ट प्लान</b> में रेगुलर से कम लागत, क्योंकि डिस्ट्रीब्यूटर कमीशन नहीं।</li><li>फ़ंड का रिस्कोमीटर और एक्सपेंस रेशियो देखें।</li></ul><div class="callout warn">बाज़ार के रिटर्न की गारंटी कोई नहीं दे सकता। Telegram/WhatsApp पर "पक्का" रिटर्न या टिप्स देने वाले सावधान। सलाहकार SEBI-पंजीकृत है, जाँचें।</div><p>Wisecrest कोई ख़ास फ़ंड या शेयर की सिफ़ारिश नहीं करता।</p>`], src: "SEBI investor education; AMFI" },

{ id: "fdvsppf", tp: "inv", ic: "🆚", t: ["FD vs PPF vs debt fund: after tax", "FD बनाम PPF बनाम डेट फ़ंड: टैक्स के बाद"], s: ["The headline rate isn't what you keep.", "दिखने वाली दर आपको नहीं मिलती।"], tools: ["fd", "ppf", "scss"],
  b: [`<table class="t"><thead><tr><th>Option</th><th>Rate now</th><th>Tax</th><th>Lock-in</th></tr></thead><tbody><tr><td>Bank FD</td><td>6–8%</td><td>Slab rate on interest every year</td><td>Flexible (penalty if broken)</td></tr><tr><td>PPF</td><td>${SMALL.ppf}%</td><td>Tax-free</td><td>15 years (partial withdrawal from year 7)</td></tr><tr><td>SCSS (60+)</td><td>${SMALL.scss}%</td><td>Slab rate</td><td>5 years</td></tr><tr><td>Debt fund</td><td>Varies</td><td>Slab rate when you sell</td><td>None</td></tr></tbody></table><p>In the 30% slab, a 7% FD gives about 4.8% after tax, while PPF's 7.1% stays 7.1%. In a low slab, FDs and SCSS are simpler and fully flexible.</p>`,
  `<table class="t"><thead><tr><th>विकल्प</th><th>अभी दर</th><th>टैक्स</th><th>लॉक-इन</th></tr></thead><tbody><tr><td>बैंक FD</td><td>6–8%</td><td>हर साल ब्याज पर स्लैब दर</td><td>लचीला (तोड़ने पर पेनल्टी)</td></tr><tr><td>PPF</td><td>${SMALL.ppf}%</td><td>टैक्स-फ़्री</td><td>15 साल (7वें साल से आंशिक निकासी)</td></tr><tr><td>SCSS (60+)</td><td>${SMALL.scss}%</td><td>स्लैब दर</td><td>5 साल</td></tr><tr><td>डेट फ़ंड</td><td>बदलती</td><td>बेचने पर स्लैब दर</td><td>नहीं</td></tr></tbody></table><p>30% स्लैब में 7% FD टैक्स के बाद लगभग 4.8% देती है, जबकि PPF का 7.1% पूरा 7.1% रहता है। कम स्लैब में FD और SCSS आसान और पूरी तरह लचीले।</p>`], src: "Ministry of Finance small savings notification, Q3 FY27" },

{ id: "npsrules", tp: "inv", ic: "🧓", t: ["New NPS exit rules (from December 2025)", "NPS के नए निकासी नियम (दिसंबर 2025 से)"], s: ["Up to 80% lump sum for non-government subscribers.", "गैर-सरकारी सदस्यों के लिए 80% तक एकमुश्त।"], tools: ["nps", "retire"],
  b: [`<p>PFRDA changed the exit rules for non-government NPS subscribers (All Citizen and Corporate models):</p><ul><li><b>Corpus above ₹12 lakh:</b> up to 80% as lump sum, at least 20% must buy an annuity (pension).</li><li><b>₹8–12 lakh:</b> up to ₹6 lakh as lump sum; the rest through systematic withdrawal or annuity.</li><li><b>Up to ₹8 lakh:</b> can be withdrawn fully.</li><li>The 5-year lock-in for non-government subscribers has been removed, and you can stay invested up to age 85.</li><li>Government employees still have a 60% lump-sum cap.</li></ul>`,
  `<p>PFRDA ने गैर-सरकारी NPS सदस्यों (ऑल सिटिज़न और कॉर्पोरेट मॉडल) के निकासी नियम बदले:</p><ul><li><b>₹12 लाख से ज़्यादा कॉर्पस:</b> 80% तक एकमुश्त, कम से कम 20% से एन्युटी (पेंशन)।</li><li><b>₹8–12 लाख:</b> ₹6 लाख तक एकमुश्त; बाकी व्यवस्थित निकासी या एन्युटी से।</li><li><b>₹8 लाख तक:</b> पूरा निकाल सकते हैं।</li><li>गैर-सरकारी सदस्यों के लिए 5 साल का लॉक-इन हटा, और 85 की उम्र तक निवेशित रह सकते हैं।</li><li>सरकारी कर्मचारियों के लिए अब भी 60% एकमुश्त सीमा।</li></ul>`], src: "PFRDA (Exits and Withdrawals under NPS) Amendment Regulations, 2025" },

{ id: "newact", tp: "tax", ic: "📘", t: ["The new Income-tax Act 2025: what changed for you", "नया आयकर अधिनियम 2025: आपके लिए क्या बदला"], s: ["'Tax Year' replaces 'assessment year'. Slabs unchanged.", "'असेसमेंट ईयर' की जगह 'टैक्स ईयर'। स्लैब वही।"], tools: ["incometax", "regime", "itr"],
  b: [`<p>The Income-tax Act 2025 replaced the 1961 Act from <b>1 April 2026</b>. For most people, the tax you pay hasn't changed; the language and section numbers have.</p><ul><li><b>"Tax Year"</b> replaces "previous year" and "assessment year". Income from April 2026 to March 2027 is Tax Year 2026-27.</li><li><b>Slabs are unchanged:</b> new regime nil up to ₹12 lakh taxable (₹12.75 lakh for salaried).</li><li>The old regime still exists, with the same deductions.</li><li>HRA: Bengaluru, Hyderabad, Pune and Ahmedabad now get the 50% limit, like the four big metros.</li><li>Income earned before April 2026 (FY 2025-26) is still filed under the old Act, in 2026.</li><li>New ITR forms for Tax Year 2026-27 will come before you file in 2027.</li></ul>`,
  `<p>आयकर अधिनियम 2025 ने <b>1 अप्रैल 2026</b> से 1961 के अधिनियम की जगह ली। ज़्यादातर लोगों का टैक्स नहीं बदला; भाषा और धारा नंबर बदले हैं।</p><ul><li><b>"टैक्स ईयर"</b> ने "पिछला वर्ष" और "असेसमेंट ईयर" की जगह ली। अप्रैल 2026 से मार्च 2027 की आय = टैक्स ईयर 2026-27।</li><li><b>स्लैब वही:</b> नई व्यवस्था में ₹12 लाख टैक्स योग्य आय तक शून्य (नौकरीपेशा ₹12.75 लाख)।</li><li>पुरानी व्यवस्था अब भी, वही छूटों के साथ।</li><li>HRA: बेंगलुरु, हैदराबाद, पुणे और अहमदाबाद को भी चार बड़े महानगरों की तरह 50% सीमा।</li><li>अप्रैल 2026 से पहले की आय (FY 2025-26) पुराने अधिनियम में, 2026 में फ़ाइल।</li><li>टैक्स ईयर 2026-27 के नए ITR फ़ॉर्म 2027 में फ़ाइलिंग से पहले आएँगे।</li></ul>`], src: "Income-tax Act 2025; Income-tax Rules 2026; Union Budget 2026" },

{ id: "ais", tp: "tax", ic: "🔍", t: ["Form 16, 26AS and AIS: check before you file", "फ़ॉर्म 16, 26AS और AIS: फ़ाइल से पहले जाँचें"], s: ["Most tax notices come from mismatches.", "ज़्यादातर नोटिस मिलान न होने से आते हैं।"], tools: ["itr", "tds"],
  b: [`<ul><li><b>Form 16</b>: from your employer; shows salary and TDS.</li><li><b>Form 26AS</b>: all tax deducted or paid against your PAN.</li><li><b>AIS (Annual Information Statement)</b>: everything the department knows: interest, dividends, share and property sales, big cash deposits.</li></ul><p>Download 26AS and AIS from the e-filing portal. Make sure every interest and dividend entry is in your return. If something in AIS is wrong, give feedback on it in the portal before filing.</p>`,
  `<ul><li><b>फ़ॉर्म 16</b>: नियोक्ता से; सैलरी और TDS।</li><li><b>फ़ॉर्म 26AS</b>: आपके PAN पर कटा या भरा सारा टैक्स।</li><li><b>AIS (वार्षिक सूचना विवरण)</b>: विभाग जो कुछ जानता है: ब्याज, डिविडेंड, शेयर और प्रॉपर्टी बिक्री, बड़ी नकद जमा।</li></ul><p>ई-फ़ाइलिंग पोर्टल से 26AS और AIS डाउनलोड करें। हर ब्याज और डिविडेंड रिटर्न में हो। AIS में कुछ ग़लत हो तो फ़ाइल करने से पहले पोर्टल पर फ़ीडबैक दें।</p>`], src: "Income Tax Department" },

{ id: "f15guide", tp: "tax", ic: "📄", t: ["Form 15G and 15H: who can use them", "फ़ॉर्म 15G और 15H: कौन भर सकता है"], s: ["Stop TDS on interest only if your tax is nil.", "टैक्स शून्य हो तभी ब्याज पर TDS रोकें।"], tools: ["f15", "tds"],
  b: [`<ul><li><b>15H</b>: age 60+, and tax on your estimated total income is nil.</li><li><b>15G</b>: below 60, tax is nil, and total income is within the basic exemption limit.</li><li>Submit to each bank/post office at the start of the financial year.</li><li>A false declaration is an offence. If your income is taxable, let TDS be cut and adjust in your return.</li></ul>`,
  `<ul><li><b>15H</b>: 60+ उम्र, और अनुमानित कुल आय पर टैक्स शून्य।</li><li><b>15G</b>: 60 से कम, टैक्स शून्य, और कुल आय मूल छूट सीमा के अंदर।</li><li>वित्त वर्ष की शुरुआत में हर बैंक/डाकघर में जमा करें।</li><li>ग़लत घोषणा अपराध है। आय टैक्स योग्य हो तो TDS कटने दें और रिटर्न में समायोजित करें।</li></ul>`], src: "Income Tax Department" },
