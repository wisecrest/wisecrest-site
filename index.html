function parseAmt(q) {
  const m = q.match(/(\d+(?:[.,]\d+)?)\s*(lakh|lac|lakhs|l|crore|cr|k|thousand|hazar|hazaar)?\b/i); if (!m) return null;
  let n = parseFloat(m[1].replace(",", "")); const s = (m[2] || "").toLowerCase();
  n *= /^(lakh|lac|lakhs|l)$/.test(s) ? 1e5 : /^(crore|cr)$/.test(s) ? 1e7 : /^(k|thousand|hazar|hazaar)$/.test(s) ? 1e3 : 1; return n;
}
const STOP = new Set(["ka", "ki", "ke", "kya", "kaise", "kitna", "kitni", "hai", "me", "mein", "how", "to", "the", "a", "of", "for", "my", "is", "what", "lakh", "lac", "crore", "cr", "k", "and", "on"]);
function doSearch(q) {
  q = q.toLowerCase().trim(); if (!q) return [];
  const terms = q.split(/[\s,]+/).filter(w => w && !STOP.has(w) && !/^\d/.test(w));
  const amt = parseAmt(q), out = [];
  INDEX.forEach(it => { let s = 0; const ws = it.ws || (it.ws = new Set(it.k.split(/[^a-z0-9\u0900-\u097f]+/))); terms.forEach(w => { if (ws.has(w)) s += 3; else if (w.length > 3 && it.k.includes(w)) s += 1; if (it.id === w) s += 4; }); if (/kitna|kitni/.test(q) && /emi|tax|salary/.test(it.k)) s += .5; if (s) out.push({ ...it, sc: s * it.w }); });
  out.sort((a, b) => b.sc - a.sc);
  const res = out.slice(0, 8);
  if (amt && res[0] && res[0].h.startsWith("#t-")) { const id = res[0].h.slice(3), t = TOOL[id], f = t.in.find(i => i.t === "money"); if (f) res[0] = { ...res[0], h: `#t-${id}?${f.id}=${Math.round(amt)}`, s: [words(amt) + " →", words(amt) + " →"] }; }
  return res;
}
function bindSearch(input, box, onPick) {
  let sel = 0;
  const draw = () => { const r = doSearch(input.value); if (!input.value.trim()) { box.style.display = "none"; return; }
    box.innerHTML = r.length ? r.map((x, i) => `<a href="${x.h}" class="${i === sel ? "sel" : ""}"><span>${x.ic} ${T(x.t)}</span><small>${T(x.s)}</small></a>`).join("") : `<a><span>${u("noresult")}</span></a>`; box.style.display = "block"; };
  input.addEventListener("input", () => { sel = 0; draw(); });
  input.addEventListener("keydown", e => { const a = box.querySelectorAll("a[href]"); if (e.key === "ArrowDown") { sel = Math.min(a.length - 1, sel + 1); draw(); e.preventDefault(); } if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); } if (e.key === "Enter" && a[sel]) { location.hash = a[sel].getAttribute("href"); onPick && onPick(); } if (e.key === "Escape") onPick && onPick(); });
  box.addEventListener("click", e => { if (e.target.closest("a[href]")) { box.style.display = "none"; onPick && onPick(); } });
}

};
function legalPage(k) { const [t, b, h] = LEGAL[k]; return `<div class="wrap page">${crumbs([[null, t]])}<article class="prose"><h1 class="pt">${T(t)}</h1>${LANG === "hi" ? `<div class="callout">${h[0]}</div><p class="meta" style="margin-top:10px">पूरा पाठ अंग्रेज़ी में:</p>` : ""}${b}</article></div>`; }
function notFound() { return `<div class="wrap page"><h1 class="pt">${u("notfound")}</h1><p class="lead"><a href="#home" style="color:var(--teal)">← ${u("home")}</a></p></div>`; }

/* ================= router ================= */
function route(keepScroll) {
  const [path, query] = (location.hash.slice(1) || "home").split("?"); const qs = new URLSearchParams(query || "");
  if (path === "search") { openOverlay(); history.replaceState(null, "", "#home"); return; }
  closeOverlay(); renderShell();
  let html, after;
  if (path.startsWith("t-")) { html = toolPage(path.slice(2), qs); after = () => toolAfter(path.slice(2)); }
  else if (path.startsWith("g-")) html = guidePage(path.slice(2));
  else if (path.startsWith("for-")) html = personaPage(path.slice(4));
  else if (LEGAL[path]) html = legalPage(path);
  else if (PAGES[path]) { html = PAGES[path](); after = PAGES[path].after; }
  else html = notFound();
  app.innerHTML = html; after && after();
  const title = app.querySelector("h1"); document.title = (path === "home" ? "Wisecrest: " + T(["India's money questions, answered simply", "पैसे का हर सवाल, आसान जवाब"]) : (title ? title.textContent.trim() + " | Wisecrest" : "Wisecrest"));
  if (!keepScroll) window.scrollTo(0, 0);
}
function setLang(l) { LANG = l; document.body.classList.toggle("hi", l === "hi"); document.documentElement.lang = l; document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === l)); store.set("lang", l); buildIndex(); renderTicker(); route(true); cookieBar(); }

/* ================= cookie consent ================= */
function cookieBar() {
  let el = $("#cookie"); const c = store.get("consent", null);
  if (c !== null) { el && el.remove(); return; }
  if (!el) { el = document.createElement("div"); el.id = "cookie"; el.className = "cookie"; document.body.appendChild(el); }
  el.innerHTML = `<div>🍪 ${u("cookie")} <a href="#privacy" style="color:var(--teal);font-weight:700">${T(["Privacy", "गोपनीयता"])}</a></div><div class="row"><button class="btn ghost" data-c="0">${u("reject")}</button><button class="btn ghost" data-c="1">${u("accept")}</button></div>`;
  el.querySelectorAll("button").forEach(b => b.onclick = () => { store.set("consent", b.dataset.c === "1"); el.remove(); window.dispatchEvent(new CustomEvent("wc-consent", { detail: b.dataset.c === "1" })); });
}

/* ================= init ================= */
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
$("#openSearch").onclick = openOverlay;
$("#ovl").addEventListener("click", e => { if (e.target.id === "ovl") closeOverlay(); });
bindSearch($("#oq"), $("#ores"), closeOverlay);
document.addEventListener("keydown", e => { if (e.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); openOverlay(); } if (e.key === "Escape") closeOverlay(); });
document.addEventListener("click", e => { const a = e.target.closest("a[data-search]"); if (a) { e.preventDefault(); openOverlay(); } if (!e.target.closest(".search")) { const r = $("#hres"); if (r) r.style.display = "none"; } });
window.addEventListener("hashchange", () => route());
setLang(store.get("lang", "en"));
</script>
<script src="/chat.js" defer></script>
</body>
